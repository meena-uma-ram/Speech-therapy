/* Layout: fixed left rail (bottom bar on phones) + one working column; the day's schedule is the spine. */
:root {
  --bg: #f4f7f7;
  --surface: #ffffff;
  --text: #182426;
  --muted: #586a6d;
  --border: #dde5e6;
  --primary: #0e6b6b;
  --primary-ink: #ffffff;
  --primary-soft: #e1f0ef;
  --good: #1f7a4d;
  --good-soft: #e2f3e9;
  --bad: #b43b2b;
  --bad-soft: #fbe8e4;
  --info: #5a49b8;
  --info-soft: #ece9fa;
  --overlay: rgba(12, 24, 26, .45);
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16, 40, 42, .06), 0 2px 8px rgba(16, 40, 42, .04);
  --fam-language: #2f5fb3; --fam-language-soft: #e7eefb;
  --fam-speech: #7a4fb5; --fam-speech-soft: #f1eafa;
  --fam-fluency: #a8601a; --fam-fluency-soft: #fcefe0;
  --fam-social: #a63d6c; --fam-social-soft: #fae7ef;
  --fam-swallow: #487a1e; --fam-swallow-soft: #ebf4e0;
  --fam-voice: #86680a; --fam-voice-soft: #f7f0d5;
  --fam-other: #586a6d; --fam-other-soft: #eef2f2;
  --lunch: #fbf5e6; --lunch-ink: #7a5a12; --now: #d2452f;
  --font-display: ui-rounded, "SF Pro Rounded", "Avenir Next", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101718; --surface: #172122; --text: #e4ecec; --muted: #9bb0b2; --border: #283738;
    --primary: #5cc4bf; --primary-ink: #0b1a1a; --primary-soft: #1a3433;
    --good: #5ccf93; --good-soft: #163426; --bad: #f08a78; --bad-soft: #3c1f1a;
    --info: #ab9ff2; --info-soft: #28243f; --overlay: rgba(0, 0, 0, .6); --shadow: none;
    --fam-language: #8fb3f5; --fam-language-soft: #1c2943;
    --fam-speech: #c3a4f2; --fam-speech-soft: #2a2140;
    --fam-fluency: #f0b26c; --fam-fluency-soft: #3a2a17;
    --fam-social: #f099be; --fam-social-soft: #3b1d2b;
    --fam-swallow: #a6d677; --fam-swallow-soft: #213119;
    --fam-voice: #e3c75c; --fam-voice-soft: #352e14;
    --fam-other: #9bb0b2; --fam-other-soft: #212d2e;
    --lunch: #2a2616; --lunch-ink: #e6cf8a; --now: #ff7a63;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101718; --surface: #172122; --text: #e4ecec; --muted: #9bb0b2; --border: #283738;
  --primary: #5cc4bf; --primary-ink: #0b1a1a; --primary-soft: #1a3433;
  --good: #5ccf93; --good-soft: #163426; --bad: #f08a78; --bad-soft: #3c1f1a;
  --info: #ab9ff2; --info-soft: #28243f; --overlay: rgba(0, 0, 0, .6); --shadow: none;
  --fam-language: #8fb3f5; --fam-language-soft: #1c2943;
  --fam-speech: #c3a4f2; --fam-speech-soft: #2a2140;
  --fam-fluency: #f0b26c; --fam-fluency-soft: #3a2a17;
  --fam-social: #f099be; --fam-social-soft: #3b1d2b;
  --fam-swallow: #a6d677; --fam-swallow-soft: #213119;
  --fam-voice: #e3c75c; --fam-voice-soft: #352e14;
  --fam-other: #9bb0b2; --fam-other-soft: #212d2e;
  --lunch: #2a2616; --lunch-ink: #e6cf8a; --now: #ff7a63;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  font: 15px/1.5 var(--font-body);
  background: var(--bg);
  color: var(--text);
}
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, .brand { font-family: var(--font-display); text-wrap: balance; }
h1 { font-size: 1.7rem; margin: 0; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.12rem; margin: 1.5rem 0 .6rem; font-weight: 600; }
p { margin: .4rem 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.good { color: var(--good); }
.bad { color: var(--bad); }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 8px; top: 8px; z-index: 10; background: var(--surface); padding: 8px; }

/* layout */
.layout { display: flex; min-height: 100vh; }
.sidebar {
  width: 220px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
  padding: 20px 12px; position: sticky; top: 0; height: 100vh;
}
.brand { font-weight: 700; font-size: 1.1rem; padding: 0 10px 18px; display: flex; gap: 8px; align-items: center; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 8px; color: var(--text); }
.nav a:hover { background: var(--bg); text-decoration: none; }
.nav a.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
main { min-width: 0; padding-block: 28px 80px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); max-width: 980px; outline: none; }

@media (max-width: 760px) {
  .layout { flex-direction: column; }
  .sidebar {
    position: fixed; bottom: 0; top: auto; left: 0; right: 0; width: auto; height: auto; z-index: 5;
    border-right: 0; border-top: 1px solid var(--border); padding-block: 4px calc(4px + env(safe-area-inset-bottom, 0px)); padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px));
  }
  .brand { display: none; }
  .nav { flex-direction: row; justify-content: space-around; }
  .nav a { flex-direction: column; gap: 0; font-size: .65rem; padding: 6px 2px; }
  .nav a svg { width: 22px; height: 22px; }
  main { padding-block: 16px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 1.35rem; }
}

/* page header */
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.head-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.back { display: inline-block; margin-bottom: 8px; font-size: .9rem; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: inherit; font-weight: 500; padding: 8px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); color: var(--text); min-height: 38px;
}
.btn:hover { text-decoration: none; border-color: var(--muted); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn-primary:hover { filter: brightness(1.05); border-color: var(--primary); }
.btn-ghost { background: transparent; }
.btn-danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn-sm { padding: 4px 10px; min-height: 30px; font-size: .85rem; }
.link { background: none; border: 0; color: var(--primary); cursor: pointer; font: inherit; padding: 0; }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin: 14px 0; }
.actions.wrap { flex-wrap: wrap; justify-content: flex-start; }

/* badges & chips */
.badge {
  display: inline-block; font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 99px;
  background: var(--bg); color: var(--muted); border: 1px solid var(--border); text-transform: capitalize; vertical-align: middle;
}
.badge-good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.badge-info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.badge-muted { opacity: .7; }
.chip { font-size: .72rem; font-weight: 600; color: var(--primary); background: var(--primary-soft); padding: 2px 8px; border-radius: 6px; }

/* date nav */
.date-nav { display: flex; gap: 6px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.date-input { font: inherit; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); min-height: 38px; width: auto; }

/* summary strip */
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
.summary > * { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; color: var(--text); }
.summary a:hover { border-color: var(--primary); text-decoration: none; }
.stat { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .summary { grid-template-columns: repeat(2, 1fr); } }

/* schedule */
.schedule { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.appt {
  display: flex; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px; color: var(--text); box-shadow: var(--shadow);
}
.appt:hover { border-color: var(--primary); text-decoration: none; }
.appt.cancelled { opacity: .55; }
.appt-time { width: 90px; flex-shrink: 0; display: flex; flex-direction: column; }
.appt-body { flex: 1; min-width: 0; }
.appt-title { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.appt-meta { margin-top: 4px; font-size: .9rem; }
.chev { font-size: 1.6rem; color: var(--muted); }
@media (max-width: 560px) { .appt { flex-direction: column; align-items: stretch; gap: 6px; } .appt-time { width: auto; flex-direction: row; gap: 8px; align-items: baseline; } .chev { display: none; } }

/* cards & lists */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card h2 { margin: 0; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.list { list-style: none; padding: 0; margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.list li + li { border-top: 1px solid var(--border); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text); }
a.row:hover { background: var(--bg); text-decoration: none; }
.right { text-align: right; }
.empty { text-align: center; padding: 40px 16px; background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); color: var(--muted); }

/* SMART grid */
.smart { display: grid; gap: 4px; margin: 10px 0 0; }
.smart > div { display: flex; gap: 10px; align-items: baseline; }
.smart dt { width: 22px; height: 22px; flex-shrink: 0; border-radius: 6px; background: var(--primary-soft); color: var(--primary); font-weight: 700; display: grid; place-items: center; font-size: .8rem; }
.smart dd { margin: 0; }
.smart dd .muted { display: inline-block; min-width: 84px; }

/* checklists */
.checklist { list-style: none; padding: 0; margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.card .checklist { border: 0; background: none; }
.checklist li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 14px; flex-wrap: wrap; }
.checklist li + li { border-top: 1px solid var(--border); }
.checklist label { display: flex; flex-direction: row; gap: 10px; align-items: center; cursor: pointer; margin: 0; font-size: inherit; font-weight: 400; }
.checklist input { width: 18px; height: 18px; accent-color: var(--primary); }
.checklist input:checked + span { text-decoration: line-through; color: var(--muted); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0; }
.stats > div { display: flex; flex-direction: column; }
.stats .stat { font-size: 1.05rem; }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(2, 1fr); } }

/* chart */
.chart { width: 100%; height: auto; display: block; margin-top: 6px; }
.chart .grid { stroke: var(--border); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 11px; }
.chart .line { fill: none; stroke: var(--primary); stroke-width: 2.5; stroke-linejoin: round; }
.chart .dot { fill: var(--surface); stroke: var(--primary); stroke-width: 2; }
.chart .target { stroke: var(--good); stroke-dasharray: 5 4; stroke-width: 1.5; }
.chart .target-label { fill: var(--good); font-size: 11px; font-weight: 600; }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
.tab { padding: 9px 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
.tab:hover { color: var(--text); text-decoration: none; }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }

/* forms */
label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; font-weight: 500; margin-bottom: 10px; }
.label { font-size: .85rem; font-weight: 500; }
input, select, textarea {
  font: inherit; font-size: .95rem; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--text); width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
textarea { resize: vertical; }
.grid-2, .grid-3, .grid-4 { display: grid; gap: 10px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 560px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } .grid-4 { grid-template-columns: 1fr 1fr; } }
fieldset { border: 1px solid var(--border); border-radius: var(--radius); margin: 0 0 12px; }
legend { font-weight: 600; padding: 0 6px; }
.log-entry legend { font-size: .95rem; }
.pick { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.pick legend { font-size: .85rem; }
label.check { flex-direction: row; align-items: center; gap: 6px; font-weight: 400; margin: 0; }
label.check input { width: auto; }
.inline-new { width: 100%; margin-top: 8px; }
.field { margin-bottom: 10px; }
.segmented { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.segmented label { margin: 0; }
.segmented input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.segmented span { display: inline-block; padding: 6px 12px; border: 1px solid var(--border); border-radius: 99px; cursor: pointer; font-weight: 500; }
.segmented input:checked + span { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.segmented input:focus-visible + span { outline: 2px solid var(--primary); outline-offset: 2px; }
.filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.filters select { width: auto; }
#report-text { font-family: inherit; line-height: 1.55; }

/* table */
.tbl { width: 100%; border-collapse: collapse; font-size: .88rem; margin: 6px 0; }
.tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
.tbl th { color: var(--muted); font-weight: 500; }

/* modal */
dialog { border: 0; border-radius: 14px; padding: 0; width: min(640px, calc(100vw - 24px)); max-height: calc(100vh - 40px); background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
dialog::backdrop { background: var(--overlay); }
.modal-form { display: flex; flex-direction: column; max-height: calc(100vh - 40px); }
.modal-form header, .modal-form footer { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--border); }
.modal-form footer { border-bottom: 0; border-top: 1px solid var(--border); }
.modal-form h2 { margin: 0; }
.modal-body { padding: 16px 18px; overflow-y: auto; }

/* toast */
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); max-width: calc(100vw - 32px); transform: translate(-50%, 40px); opacity: 0; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px; transition: .2s; pointer-events: none; z-index: 20; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 760px) { #toast { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); } }

/* print: just the content, e.g. the materials pick list */
@media print {
  .sidebar, .page-head button, .page-head .btn, .tabs, .date-nav, #toast { display: none !important; }
  main { padding: 0; }
  .card, .checklist, .list { box-shadow: none; break-inside: avoid; }
}

/* additions */
.nav svg { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.brand svg { width: 24px; height: 24px; fill: none; stroke: var(--primary); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.meta-label { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 4px; }
.btn:focus-visible, .tab:focus-visible, .nav a:focus-visible, a.appt:focus-visible, a.row:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.btn-danger-solid { background: var(--bad); border-color: var(--bad); color: var(--surface); }
#confirm { width: min(420px, calc(100vw - 32px)); }
.confirm-form { padding: 18px; }
.confirm-form p { margin: 0 0 6px; font-size: 1rem; }
.stat, .appt-time, .tbl td { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }

/* toolbar */
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .date-nav { margin: 0; }
.seg-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg-toggle button { font: inherit; font-weight: 500; border: 0; background: none; color: var(--muted); padding: 7px 14px; cursor: pointer; min-height: 38px; }
.seg-toggle button + button { border-left: 1px solid var(--border); }
.seg-toggle button.on { background: var(--primary-soft); color: var(--primary); }
.seg-toggle button:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.stat-sep { color: var(--muted); font-weight: 400; }
.span-2 { grid-column: span 2; }
@media (max-width: 560px) { .span-2 { grid-column: auto; } }

/* case type tags: colour = condition family */
.case { display: inline-block; font-size: .72rem; font-weight: 700; padding: 1px 8px; border-radius: 6px; white-space: nowrap; vertical-align: middle;
  color: var(--fam-c, var(--fam-other)); background: var(--fam-s, var(--fam-other-soft)); }
.fam-language { --fam-c: var(--fam-language); --fam-s: var(--fam-language-soft); }
.fam-speech { --fam-c: var(--fam-speech); --fam-s: var(--fam-speech-soft); }
.fam-fluency { --fam-c: var(--fam-fluency); --fam-s: var(--fam-fluency-soft); }
.fam-social { --fam-c: var(--fam-social); --fam-s: var(--fam-social-soft); }
.fam-swallow { --fam-c: var(--fam-swallow); --fam-s: var(--fam-swallow-soft); }
.fam-voice { --fam-c: var(--fam-voice); --fam-s: var(--fam-voice-soft); }
.fam-other { --fam-c: var(--fam-other); --fam-s: var(--fam-other-soft); }
.tt-block .case { background: var(--surface); }

/* timetable */
.tt { --tt-gutter: 64px; position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.tt-row { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border); }
.tt-row.hour { border-top-style: solid; }

.tt-label { position: absolute; left: 0; width: calc(var(--tt-gutter) - 10px); top: 4px; text-align: right; font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tt-slot { position: absolute; left: var(--tt-gutter); right: 0; top: 0; bottom: 0; border: 0; background: none; cursor: pointer; text-align: left; padding: 0 10px; color: var(--primary); font: inherit; font-size: .8rem; }

.tt-lunch { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, var(--lunch) 0 10px, transparent 10px 20px), var(--lunch);
  border-block: 2px solid var(--lunch-ink); color: var(--lunch-ink); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px;
  pointer-events: none; font-size: .8rem; text-align: center; padding: 0 8px; }

.tt-now { position: absolute; left: calc(var(--tt-gutter) - 6px); right: 0; height: 0; border-top: 2px solid var(--now); z-index: 3; pointer-events: none; }
.tt-now::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }
.tt-block { position: absolute; z-index: 2; overflow: hidden; display: flex; flex-direction: column; gap: 2px; padding: 6px 10px;
  border-radius: 8px; border: 1px solid var(--border); border-left: 4px solid var(--fam-c, var(--fam-other));
  background: var(--fam-s, var(--fam-other-soft)); color: var(--text); font-size: .82rem; line-height: 1.3; }
.tt-block:hover { text-decoration: none; box-shadow: 0 0 0 2px var(--fam-c, var(--primary)); }
.tt-block:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.tt-block.cancelled { opacity: .5; text-decoration: line-through; }
.tt-line { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-width: 0; }
.tt-time { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--fam-c, var(--text)); }
.tt-name { font-size: .92rem; }
.tt-goals { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tt-block.compact { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 2px 8px; padding-block: 3px; }
.tt-block.compact .tt-goals, .tt-block.compact .badge { display: none; }

@media (max-width: 560px) {
  .tt { --tt-gutter: 46px; }

}

/* list view lunch split */
.half-head { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; }
.lunch-divider { display: flex; align-items: center; gap: 12px; margin: 18px 0 4px; color: var(--lunch-ink); font-weight: 700; font-size: .85rem; }
.lunch-divider::before, .lunch-divider::after { content: ""; flex: 1; border-top: 2px dashed var(--lunch-ink); opacity: .5; }
.lunch-divider span { background: var(--lunch); padding: 4px 12px; border-radius: 99px; }
.case { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.appt-time { width: 112px; }
@media (max-width: 560px) { .appt-time { width: auto; } }

/* ---------- roles, workflow & privacy ---------- */
:root { --warn: #9a5b00; --warn-soft: #fdf0d8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --warn: #f0b85c; --warn-soft: #3a2b12; } }
:root[data-theme="dark"] { --warn: #f0b85c; --warn-soft: #3a2b12; }

.main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.rolebar { display: flex; justify-content: space-between; align-items: center; gap: 8px 16px; flex-wrap: wrap;
  padding-block: 8px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--border); font-size: .85rem; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; }

.rb-left, .rb-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }

.rb-link { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--border); color: var(--text); }
.rb-link:hover { border-color: var(--primary); text-decoration: none; }
.rb-count { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--primary); }
.rb-link.alert { background: var(--warn-soft); border-color: transparent; }
.rb-link.alert .rb-count { color: var(--warn); }
.rb-btn { font: inherit; background: none; border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 4px 10px; cursor: pointer; min-height: 32px; }
.rb-btn[aria-pressed="true"] { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
.rb-user { flex-direction: row; align-items: center; gap: 6px; margin: 0; font-weight: 400; }
.rb-as { color: var(--muted); white-space: nowrap; }
.rb-user select { width: auto; max-width: 260px; padding: 4px 8px; font-size: .85rem; }
@media (max-width: 760px) {
  .rolebar { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: static; }
  .rb-as { display: none; }
  .rb-user select { max-width: 200px; }
  .nav { justify-content: flex-start; overflow-x: auto; scrollbar-width: none; }
  .nav a { min-width: 62px; flex-shrink: 0; }
}

body.locked .sidebar { display: none; }
.lock { min-height: 80vh; display: grid; place-items: center; }
.lock-card { width: min(420px, 100%); }

.badge-warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.prio-urgent { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.prio-soon { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.yes { color: var(--good); font-weight: 700; }
.no { color: var(--bad); font-weight: 700; }
.referral .note { background: var(--bg); border-radius: 8px; padding: 6px 10px; }
.consent-line { color: var(--muted); }

.doc-chip { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 9px; border-radius: 99px; white-space: nowrap; background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
a.doc-chip:hover { text-decoration: none; border-color: currentColor; }
.doc-chip.st-approved { background: var(--good-soft); color: var(--good); border-color: transparent; }
.doc-chip.st-submitted { background: var(--info-soft); color: var(--info); border-color: transparent; }

.doc-count { font-variant-numeric: tabular-nums; }
.doc-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; flex-wrap: wrap; }

.pre { white-space: pre-wrap; }
.timeline { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }

.safeguards, .consent-list, .plain { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.safeguards li { display: flex; gap: 10px; align-items: baseline; }

.add-user { margin-top: 12px; align-items: end; }

.refer { margin-top: 6px; }
fieldset.consent { display: block; }

/* ---------- sign-in, inbox, leave, session tools ---------- */

.span-3 { grid-column: 1 / -1; }

.add-user h3 { font-size: .95rem; margin: 16px 0 8px; }

.callout.ok { background: var(--good-soft); } .callout.ok strong { color: var(--good); } #backup-text { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .75rem; }

/* ---------- reminders & storage ---------- */
.chan { display: inline-block; font-size: .72rem; font-weight: 700; padding: 1px 8px; border-radius: 6px; vertical-align: middle; }

.sync-pill[data-state="saving"], .sync-pill[data-state="connecting"] { background: var(--info-soft); color: var(--info); }
.sync-pill[data-state="offline"] { background: var(--bad-soft); color: var(--bad); }

/* ---------- team calendar ---------- */
.who-0 { --who: var(--fam-language); --who-s: var(--fam-language-soft); }
.who-1 { --who: var(--fam-speech); --who-s: var(--fam-speech-soft); }

.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--who, var(--muted)); flex: none; }
.pchips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.pchip { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: .9rem; min-height: 38px; padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; }
.pchip.on { border-color: var(--who); background: var(--who-s); color: var(--text); }
.pchip:not(.on) .dot { background: transparent; box-shadow: inset 0 0 0 2px var(--who); }
.pchip:focus-visible, .slot-chip:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.slot-chip { font: inherit; font-size: .9rem; font-variant-numeric: tabular-nums; min-height: 36px; padding: 5px 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid transparent; background: var(--good-soft); color: var(--good); font-weight: 600; }
.slot-chip:hover { border-color: var(--good); }
.free-slots h2 { font-size: 1rem; margin: 0; }
.team-pick .card-head { flex-wrap: wrap; gap: 8px; }

.team-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; }
.team-day { display: grid; grid-template-columns: 52px repeat(var(--cols), minmax(150px, 1fr)); min-width: min-content; }
.team-gutter-head, .team-col-head { position: sticky; top: 0; z-index: 4; background: var(--surface); border-bottom: 1px solid var(--border); }

.team-gutter { position: relative; }
.team-gutter span { position: absolute; right: 8px; transform: translateY(-50%); font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.team-gutter span:first-child { transform: none; }
.team-col { position: relative; border-left: 1px solid var(--border); }
.team-col.away { background: repeating-linear-gradient(135deg, transparent 0 10px, var(--fam-other-soft) 10px 20px); }
.team-hour { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); }
.team-lunch { position: absolute; left: 0; right: 0; background: var(--lunch); color: var(--lunch-ink); font-size: .72rem; display: flex; align-items: center; justify-content: center; }
.team-away { position: absolute; inset: 8px 8px auto; z-index: 1; text-align: center; font-size: .8rem; font-weight: 600; color: var(--warn); }
.team-away span { background: var(--warn-soft); padding: 2px 8px; border-radius: 6px; }
.team-now { left: 0; }
.tm-block { position: absolute; z-index: 2; overflow: hidden; display: flex; flex-direction: column; gap: 1px; padding: 4px 8px; font: inherit; font-size: .8rem; text-align: left;
  border-radius: 6px; border: 1px solid var(--border); border-left: 4px solid var(--fam-c, var(--fam-other)); background: var(--fam-s, var(--surface)); color: var(--text); text-decoration: none; }

.tm-block.compact { flex-direction: row; gap: 6px; align-items: center; white-space: nowrap; }
.tm-block.observing { border-style: dashed; }
.tm-busy { --fam-c: var(--muted); background: repeating-linear-gradient(135deg, var(--surface) 0 6px, var(--fam-other-soft) 6px 12px); color: var(--muted); }
.tm-event { --fam-c: var(--info); --fam-s: var(--info-soft); }
.tm-time { font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.team-week th, .team-week td { vertical-align: top; min-width: 110px; }

.tw-chip { display: block; width: 100%; margin: 0 0 4px; padding: 3px 6px; border-radius: 5px; font: inherit; font-size: .78rem; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border: 0; border-left: 3px solid var(--fam-c, var(--fam-other)); background: var(--fam-s, var(--fam-other-soft)); color: var(--text); text-decoration: none; }

fieldset.checks { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 4px 12px; margin: 0 0 12px; }

/* ---------- demo workspace ---------- */

.welcome { max-width: 560px; }
.ws-choice { display: grid; gap: 12px; margin: 16px 0; }

/* ---------- consent ---------- */

.method-pick { display: grid; gap: 8px; margin-bottom: 12px; }
.method-panel { margin: 8px 0 12px; }
#sig { display: block; width: 100%; max-width: 600px; height: auto; aspect-ratio: 600 / 180; border: 2px dashed var(--border); border-radius: 8px; background: var(--surface); touch-action: none; margin-bottom: 6px; }
.scan-preview { max-width: 280px; max-height: 280px; border: 1px solid var(--border); border-radius: 8px; margin-top: 8px; }
.picto { width: 40px; height: 40px; flex: none; fill: none; stroke: var(--primary); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.consent-form.accessible { font-size: 1.15rem; line-height: 1.6; }
.consent-form.accessible .picto { width: 56px; height: 56px; }
.consent-form.accessible .choice { min-height: 56px; font-size: 1.15rem; padding: 10px 20px; }
.receipt .kv { margin-bottom: 12px; }
.sig-img { max-width: 300px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
code.hash { word-break: break-all; font-size: .75rem; }

@media print {
  .sidebar, .rolebar, .demo-banner, .no-print, .nav, #toast, .back, .head-actions, button, .btn { display: none !important; }
  body, .card { background: #fff !important; color: #000 !important; box-shadow: none !important; }
  .main-col, .layout { display: block !important; margin: 0 !important; padding: 0 !important; }
  .card { border: 1px solid #999 !important; break-inside: avoid; }
  .choice { border: 1px solid #000 !important; background: #fff !important; }
}

/* ---------- files ---------- */
.dropzone { border: 2px dashed var(--border); }
.dropzone.over { border-color: var(--primary); background: var(--primary-soft); }
.files .file-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); }
.file-icon { font-size: 1.6rem; line-height: 1; width: 32px; text-align: center; }
.file-main { flex: 1 1 240px; min-width: 0; overflow-wrap: anywhere; }
.file-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.file-to { margin-top: 8px; }
.how-files li { margin-bottom: 6px; }
#viewer { width: min(920px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); }
#viewer::backdrop { background: var(--overlay); }
.viewer { padding: 16px; }
.viewer h2 { margin: 0; overflow-wrap: anywhere; }
.viewer-body { margin-top: 12px; text-align: center; }
.viewer-body img, .viewer-body video { max-width: 100%; max-height: 70vh; border-radius: 8px; }
.viewer-body audio { width: 100%; }

</style>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
// SPDX-License-Identifier: AGPL-3.0-or-later
// Copyright (C) 2026 Meenakshi Ramesh
/* Pure helpers with no DOM or storage access, so they can be unit-tested in Node. */
(function (root) {
  'use strict';

  function uid(prefix) {
    return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function toISODate(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function todayISO() { return toISODate(new Date()); }

  function addDays(iso, n) {
    const [y, m, d] = iso.split('-').map(Number);
    return toISODate(new Date(y, m - 1, d + n));
  }

  function formatDate(iso, opts) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, opts || {
      weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
    });
  }

  function formatTime(hhmm) {
    if (!hhmm) return '';
    const [h, m] = hhmm.split(':').map(Number);
    const suffix = h >= 12 ? 'PM' : 'AM';
    return ((h + 11) % 12 + 1) + ':' + pad(m) + ' ' + suffix;
  }

  /* Accuracy as a whole percentage, or null when there were no trials. */
  function accuracy(correct, trials) {
    const t = Number(trials), c = Number(correct);
    if (!t || t <= 0 || isNaN(c)) return null;
    return Math.round(Math.min(Math.max(c, 0), t) / t * 100);
  }

  function age(dobISO, onISO) {
    if (!dobISO) return '';
    const [y, m, d] = dobISO.split('-').map(Number);
    const [ty, tm, td] = (onISO || todayISO()).split('-').map(Number);
    let years = ty - y;
    if (tm < m || (tm === m && td < d)) years--;
    return years;
  }

  /* One-line SMART goal statement assembled from its parts. */
  function smartStatement(goal) {
    const parts = [goal.specific];
    if (goal.measurable) parts.push(goal.measurable);
    if (goal.timeBound) parts.push('by ' + formatDate(goal.timeBound, { month: 'short', day: 'numeric', year: 'numeric' }));
    return parts.filter(Boolean).join(', ') + '.';
  }

  /* Accuracy history for one goal, oldest first: [{date, accuracy, trials, correct, progress}] */
  function goalSeries(goalId, logs) {
    const points = [];
    logs.forEach(function (log) {
      (log.entries || []).forEach(function (e) {
        if (e.goalId !== goalId) return;
        const acc = e.accuracy != null ? e.accuracy : accuracy(e.correct, e.trials);
        if (acc == null) return;
        points.push({ date: log.date, accuracy: acc, trials: e.trials, correct: e.correct, progress: e.progress, note: e.note });
      });
    });
    return points.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }

  /* Summary stats for a goal's series. Trend compares the last 3 sessions with the 3 before. */
  function goalStats(series, target) {
    if (!series.length) return { sessions: 0, latest: null, average: null, trend: 'none', metTarget: false };
    const vals = series.map(function (p) { return p.accuracy; });
    const avg = function (a) { return a.reduce(function (s, v) { return s + v; }, 0) / a.length; };
    const recent = vals.slice(-3), prior = vals.slice(-6, -3);
    let trend = 'steady';
    if (prior.length) {
      const diff = avg(recent) - avg(prior);
      trend = diff >= 5 ? 'up' : diff <= -5 ? 'down' : 'steady';
    } else if (vals.length >= 2) {
      const diff = vals[vals.length - 1] - vals[0];
      trend = diff >= 5 ? 'up' : diff <= -5 ? 'down' : 'steady';
    }
    const latest = vals[vals.length - 1];
    return {
      sessions: vals.length,
      latest: latest,
      average: Math.round(avg(vals)),
      trend: trend,
      metTarget: target != null && target !== '' && latest >= Number(target)
    };
  }

  /*
   * Materials needed across a set of appointments.
   * Returns [{material, sessions:[{appointment, patient}], count}] sorted by count desc then name.
   */
  function materialsForDay(appointments, goalsById, materialsById, patientsById) {
    const map = {};
    appointments.forEach(function (appt) {
      if (appt.status === 'cancelled') return;
      const seen = {};
      (appt.goalIds || []).forEach(function (gid) {
        const goal = goalsById[gid];
        if (!goal) return;
        (goal.materialIds || []).forEach(function (mid) {
          if (seen[mid] || !materialsById[mid]) return;
          seen[mid] = true;
          if (!map[mid]) map[mid] = { material: materialsById[mid], sessions: [] };
          map[mid].sessions.push({ appointment: appt, patient: patientsById[appt.patientId] });
        });
      });
      (appt.extraMaterialIds || []).forEach(function (mid) {
        if (seen[mid] || !materialsById[mid]) return;
        seen[mid] = true;
        if (!map[mid]) map[mid] = { material: materialsById[mid], sessions: [] };
        map[mid].sessions.push({ appointment: appt, patient: patientsById[appt.patientId] });
      });
    });
    return Object.keys(map).map(function (k) {
      map[k].count = map[k].sessions.length;
      return map[k];
    }).sort(function (a, b) {
      return b.count - a.count || a.material.name.localeCompare(b.material.name);
    });
  }

  /* Material ids needed for a single appointment (goal materials + extras, de-duplicated). */
  function appointmentMaterialIds(appt, goalsById) {
    const ids = [];
    (appt.goalIds || []).forEach(function (gid) {
      const g = goalsById[gid];
      (g && g.materialIds || []).forEach(function (mid) { if (ids.indexOf(mid) < 0) ids.push(mid); });
    });
    (appt.extraMaterialIds || []).forEach(function (mid) { if (ids.indexOf(mid) < 0) ids.push(mid); });
    return ids;
  }

  function toMinutes(hhmm) {
    if (!hhmm) return 0;
    const [h, m] = hhmm.split(':').map(Number);
    return h * 60 + (m || 0);
  }

  function fromMinutes(mins) { return pad(Math.floor(mins / 60)) + ':' + pad(mins % 60); }

  /*
   * Timetable layout for one day. Overlapping sessions sit side by side in lanes.
   * Returns { start, end, blocks:[{appt, start, end, lane, lanes}] } with times in minutes since midnight.
   * The visible range is at least dayStart–dayEnd and stretches to whole hours around any session outside it.
   */
  function layoutDay(appointments, dayStart, dayEnd) {
    const items = appointments.map(function (a) {
      const start = toMinutes(a.time);
      return { appt: a, start: start, end: start + (Number(a.duration) || 30), lane: 0, lanes: 1 };
    }).sort(function (a, b) { return a.start - b.start || b.end - a.end; });

    let cluster = [], laneEnds = [], clusterEnd = -1;
    function closeCluster() {
      cluster.forEach(function (it) { it.lanes = laneEnds.length; });
      cluster = []; laneEnds = [];
    }
    items.forEach(function (it) {
      if (it.start >= clusterEnd) closeCluster();
      let lane = laneEnds.findIndex(function (end) { return end <= it.start; });
      if (lane < 0) { lane = laneEnds.length; laneEnds.push(it.end); } else laneEnds[lane] = it.end;
      it.lane = lane;
      cluster.push(it);
      clusterEnd = Math.max(clusterEnd, it.end);
    });
    closeCluster();

    let start = toMinutes(dayStart || '08:00'), end = toMinutes(dayEnd || '17:00');
    items.forEach(function (it) {
      start = Math.min(start, Math.floor(it.start / 60) * 60);
      end = Math.max(end, Math.ceil(it.end / 60) * 60);
    });
    return { start: start, end: end, blocks: items };
  }

  /* Split sessions into before / after lunch by start time. */
  function splitByLunch(appointments, lunchStart) {
    const cut = toMinutes(lunchStart || '12:00');
    return {
      morning: appointments.filter(function (a) { return toMinutes(a.time) < cut; }),
      afternoon: appointments.filter(function (a) { return toMinutes(a.time) >= cut; })
    };
  }

  /* Case types: the condition picks a colour family so a day's mix is visible at a glance. */
  const CONDITIONS = {
    Child: ['DLD', 'Speech sound disorder', 'CLP', 'Childhood apraxia of speech', 'Autism', 'Stammering', 'Hearing loss', 'Feeding', 'Voice', 'Global developmental delay'],
    Adult: ['Stroke – aphasia', 'Stroke – dysarthria', 'Dysphagia', "Parkinson's", 'TBI', 'Head & neck cancer', 'Dementia', 'Voice', 'Stammering', 'MND']
  };
  const FAMILY_RULES = [
    ['swallow', /dysphag|feed|swallow/i],
    ['language', /dld|aphasia|language|dementia|tbi|developmental/i],
    ['speech', /clp|cleft|speech sound|ssd|apraxia|cas|dysarthria|parkinson|mnd|artic|phono|hearing/i],
    ['fluency', /stammer|stutter|fluen/i],
    ['social', /autis|asd|social|pragmat/i],
    ['voice', /voice|head & neck|laryn/i]
  ];
  function conditionFamily(condition) {
    for (let i = 0; i < FAMILY_RULES.length; i++) if (FAMILY_RULES[i][1].test(condition || '')) return FAMILY_RULES[i][0];
    return 'other';
  }
  function ageGroup(patient, onISO) {
    if (patient.ageGroup) return patient.ageGroup;
    if (!patient.dob) return '';
    return age(patient.dob, onISO) >= 18 ? 'Adult' : 'Child';
  }
  function caseLabel(patient) {
    return [ageGroup(patient), patient.condition].filter(Boolean).join(' · ');
  }

  /* ---------- people, privacy and workflow ---------- */

  const ROLES = {
    diagnostician: { label: 'Diagnostician', dept: 'Diagnostics' },
    therapist: { label: 'Speech therapist', dept: 'Therapy' },
    supervisor: { label: 'Clinical supervisor', dept: 'Therapy' },
    student: { label: 'Student clinician', dept: 'Therapy' }
  };

  function initials(name) {
    return (name || '').split(/\s+/).filter(Boolean).map(function (w) { return w[0].toUpperCase() + '.'; }).join('');
  }

  function caseCode(year, n) { return 'SLT-' + String(year).slice(-2) + '-' + String(n).padStart(3, '0'); }

  /* Who may open a patient's record (need-to-know). */
  /*
   * Who may open a patient's record (need-to-know). Supervisors see everything.
   * Clinicians see their own patients, plus any in `grants` (sessions they cover or observe).
   */
  function canSeePatient(user, p, grants) {
    if (!user || !p) return false;
    if (grants && grants[p.id]) return true;
    switch (user.role) {
      case 'supervisor': return true;
      case 'diagnostician': return p.status === 'waiting' || p.assessedBy === user.id;
      case 'therapist':
      case 'student': return p.assignedTo === user.id;
      default: return false;
    }
  }

  /* Can this patient be allotted to this clinician? */
  function canAllot(p, assignee) {
    if (!assignee) return { ok: false, reason: 'Choose who will take the case.' };
    const c = p.consent || {};
    if (!c.therapy) return { ok: false, reason: 'Consent for therapy has not been recorded.' };
    if (assignee.role === 'student' && !c.students) return { ok: false, reason: 'No consent for student clinicians. Allot to a qualified therapist, or record consent first.' };
    return { ok: true };
  }

  function addYears(iso, n) {
    const [y, m, d] = iso.split('-').map(Number);
    return toISODate(new Date(y + n, m - 1, d));
  }

  /* Discharged records whose retention period has run out. */
  function isPastRetention(p, years, today) {
    return p.status === 'discharged' && !!p.dischargedAt && addYears(p.dischargedAt, Number(years) || 0) <= (today || todayISO());
  }

  const DOC_TYPES = {
    'pre-assessment': { label: 'Pre-assessment', perSession: false },
    'lesson-plan': { label: 'Lesson plan', perSession: true },
    'session-report': { label: 'Session report', perSession: true },
    'conclusion': { label: 'Conclusion report', perSession: false }
  };
  const DOC_FIELDS = {
    'pre-assessment': [
      ['background', 'Background & case history', 4], ['assessments', 'Assessments used', 3], ['findings', 'Findings & baseline', 4],
      ['impressions', 'Clinical impressions', 3], ['goals', 'Proposed long- and short-term goals', 4], ['plan', 'Intervention plan', 3]],
    'lesson-plan': [
      ['objectives', 'Objectives (SMART)', 4], ['procedure', 'Activities & procedure', 5], ['materials', 'Materials', 2],
      ['cueing', 'Cueing hierarchy & reinforcement', 3], ['carryover', 'Home practice / carry-over', 2], ['backup', 'Back-up plan', 2]],
    'session-report': [
      ['subjective', 'S – Subjective', 3], ['objective', 'O – Objective (data)', 5], ['assessment', 'A – Assessment', 3], ['plan', 'P – Plan', 3]],
    'conclusion': [
      ['summary', 'Summary of intervention', 4], ['outcomes', 'Goal outcomes', 5], ['recommendations', 'Recommendations', 3], ['discharge', 'Discharge or continuation plan', 2]]
  };
  const DOC_STATUS = { draft: 'Draft', submitted: 'Awaiting review', approved: 'Approved', returned: 'Changes requested' };

  /* Pre-filled starting text for each document, built from what the app already knows. */
  function prefillDoc(type, ctx) {
    const p = ctx.patient || {}, a = ctx.assessment || {};
    const goals = ctx.goals || [];
    const numbered = function (list) { return list.map(function (g, i) { return (i + 1) + '. ' + smartStatement(g); }).join('\n'); };
    if (type === 'pre-assessment') {
      return {
        background: [caseLabel(p), p.diagnosis, a.source ? 'Referred by ' + a.source + (a.reason ? ' for ' + a.reason : '') + '.' : '', a.history].filter(Boolean).join('. ').replace(/\.\./g, '.'),
        assessments: a.tests || '',
        findings: a.findings || '',
        impressions: [a.diagnosis, a.severity ? a.severity + ' severity' : ''].filter(Boolean).join(', '),
        goals: numbered(goals),
        plan: [a.recommendations, a.frequency ? 'Frequency: ' + a.frequency : ''].filter(Boolean).join('\n')
      };
    }
    if (type === 'lesson-plan') {
      return { objectives: numbered(goals), procedure: '', materials: (ctx.materials || []).map(function (m) { return m.name; }).join(', '), cueing: '', carryover: '', backup: '' };
    }
    if (type === 'session-report') {
      const log = ctx.log;
      const byId = {};
      goals.forEach(function (g) { byId[g.id] = g; });
      const objective = log ? (log.entries || []).map(function (e) {
        const g = byId[e.goalId];
        if (!g) return '';
        const acc = e.accuracy != null ? e.accuracy : accuracy(e.correct, e.trials);
        if (acc == null && !e.note) return '';
        return '• ' + g.title + ': ' + (e.trials ? e.correct + '/' + e.trials + ' ' : '') + (acc != null ? '(' + acc + '%)' : 'no score') + (e.cueing ? ', ' + e.cueing.toLowerCase() + ' cues' : '') + (e.note ? ' – ' + e.note : '');
      }).filter(Boolean).join('\n') : '';
      const assess = log ? (log.entries || []).filter(function (e) { return e.progress && byId[e.goalId]; })
        .map(function (e) { return byId[e.goalId].title + ': ' + PROGRESS_LABELS[e.progress].toLowerCase(); }).join('; ') : '';
      return { subjective: log ? log.notes || '' : '', objective: objective, assessment: assess, plan: log && log.homework ? 'Home practice: ' + log.homework : '' };
    }
    if (type === 'conclusion') {
      const logs = (ctx.logs || []).slice().sort(function (x, y) { return x.date < y.date ? -1 : 1; });
      const summary = logs.length ? logs.length + ' sessions between ' + formatDate(logs[0].date, { day: 'numeric', month: 'short', year: 'numeric' }) +
        ' and ' + formatDate(logs[logs.length - 1].date, { day: 'numeric', month: 'short', year: 'numeric' }) + '.' : 'No sessions logged.';
      const outcomes = goals.map(function (g) {
        const series = goalSeries(g.id, logs);
        const st = goalStats(series, g.targetAccuracy);
        if (!series.length) return '• ' + g.title + ': no data';
        return '• ' + g.title + ': ' + series[0].accuracy + '% → ' + st.latest + '% (target ' + g.targetAccuracy + '%) – ' + (st.metTarget ? 'met' : 'not yet met');
      }).join('\n');
      return { summary: summary, outcomes: outcomes, recommendations: '', discharge: '' };
    }
    return {};
  }

  /* Coursework progress for one case: counts by document type and status, plus the next thing to do. */
  function caseProgress(docs, sessionsLogged) {
    const out = {};
    Object.keys(DOC_TYPES).forEach(function (t) { out[t] = { total: 0, approved: 0, submitted: 0, returned: 0, draft: 0 }; });
    docs.forEach(function (d) { if (out[d.type]) { out[d.type].total++; out[d.type][d.status]++; } });
    let next = 'Up to date';
    const returned = docs.filter(function (d) { return d.status === 'returned'; });
    if (returned.length) next = 'Revise ' + DOC_TYPES[returned[0].type].label.toLowerCase();
    else if (!out['pre-assessment'].approved) next = out['pre-assessment'].submitted ? 'Pre-assessment awaiting review' : 'Write pre-assessment';
    else if (out['session-report'].total < (sessionsLogged || 0)) next = 'Write session report';
    out.next = next;
    return out;

            intro: '{clinic} बोलने और भाषा की जाँच और थेरेपी देता है। शुरू करने से पहले हम पूछते हैं कि आप किन बातों के लिए सहमत हैं। आप कुछ के लिए हाँ और कुछ के लिए ना कह सकते हैं। नीचे दिए वैकल्पिक उपयोगों के लिए ना कहने से आपके इलाज पर कोई असर नहीं पड़ता।',
            clinicalHead: 'जाँच और थेरेपी के लिए सहमति',
            dataHead: 'हम आपकी जानकारी का उपयोग कैसे करते हैं',
            purposes: {
              treatment: { label: 'जाँच और थेरेपी', text: 'स्पीच और लैंग्वेज थेरेपिस्ट जाँच करेंगे और थेरेपी देंगे। वे हर कदम समझाएँगे; आप कभी भी सवाल पूछ सकते हैं या रोक सकते हैं।', simple: 'हम बोलने और भाषा की जाँच करेंगे और थेरेपी देंगे। आप कभी भी रोक सकते हैं।' },
              records: { label: 'इलाज के लिए रिकॉर्ड रखना', text: 'सुरक्षित और लगातार इलाज के लिए हम नोट्स, लक्ष्य, सत्र रिकॉर्ड और रिपोर्ट रखते हैं। सिर्फ़ इलाज करने वाले लोग इन्हें देख सकते हैं। आपको भेजने वाले विशेषज्ञ को हम एक छोटा सारांश भेजते हैं। थेरेपी खत्म होने के बाद हम इन्हें {years} साल तक रखते हैं।', simple: 'हम थेरेपी के नोट्स लिखते हैं। सिर्फ़ आपके थेरेपिस्ट देखते हैं।' },
              students: { label: 'निगरानी में छात्र थेरेपिस्ट', text: 'योग्य थेरेपिस्ट की निगरानी में छात्र जाँच या थेरेपी कर सकते हैं और ज़रूरी नोट्स देख सकते हैं।', simple: 'शिक्षक की निगरानी में एक छात्र मदद कर सकता है।' },
              reports: { label: 'परिवार को प्रगति रिपोर्ट', text: 'आपके दिए संपर्क पर हम सुरक्षित लिंक से छोटी रिपोर्ट भेज सकते हैं।', simple: 'हम आपको छोटी रिपोर्ट भेज सकते हैं।' },
              reminders: { label: 'अपॉइंटमेंट रिमाइंडर', text: 'हम SMS या WhatsApp Business से रिमाइंडर भेज सकते हैं। उनमें सिर्फ़ क्लिनिक का नाम, तारीख, समय और लिंक होगा, स्वास्थ्य की कोई जानकारी नहीं।', simple: 'समय याद दिलाने के लिए हम संदेश भेज सकते हैं।' },
              teaching: { label: 'नाम छिपाकर पढ़ाई में उपयोग', text: 'नाम की जगह केस कोड और आद्याक्षर लिखकर छात्र इस केस को कोर्सवर्क और पढ़ाई में उपयोग कर सकते हैं। कभी-कभी फिर भी कोई पहचान सकता है, इसलिए हम अलग से पूछते हैं।', simple: 'छात्र इस केस से सीख सकते हैं। हम नाम छिपाएँगे।' }
            },
            rights: 'आप अपनी जानकारी देख सकते हैं, उसे ठीक करवा सकते हैं, और कोई भी सहमति कभी भी वापस ले सकते हैं। सवाल या शिकायत के लिए {contact} से संपर्क करें। आप भारत के डेटा संरक्षण बोर्ड से भी शिकायत कर सकते हैं।',
            signHere: 'मैंने यह जानकारी पढ़ी है या मुझे समझाई गई है, और ऊपर दिए उत्तर मेरी अपनी पसंद हैं।'

          ml: {
            status: 'draft-translation',
            title: 'നിങ്ങളുടെ ചികിത്സയും നിങ്ങളുടെ വിവരങ്ങളുടെ ഉപയോഗവും',
            intro: '{clinic} സംസാര-ഭാഷാ പരിശോധനയും തെറാപ്പിയും നൽകുന്നു. തുടങ്ങുന്നതിനു മുൻപ് നിങ്ങൾ എന്തിനൊക്കെ സമ്മതിക്കുന്നു എന്ന് ഞങ്ങൾ ചോദിക്കുന്നു. ചിലതിന് അതെ എന്നും ചിലതിന് ഇല്ല എന്നും പറയാം. ഐച്ഛിക ഉപയോഗങ്ങൾക്ക് ഇല്ല എന്നു പറഞ്ഞാലും ചികിത്സ മാറില്ല.',
            clinicalHead: 'പരിശോധനയ്ക്കും തെറാപ്പിക്കുമുള്ള സമ്മതം',
            dataHead: 'നിങ്ങളുടെ വിവരങ്ങൾ ഞങ്ങൾ എങ്ങനെ ഉപയോഗിക്കുന്നു',
            purposes: {
              treatment: { label: 'പരിശോധനയും തെറാപ്പിയും', text: 'സ്പീച്ച്-ലാംഗ്വേജ് തെറാപ്പിസ്റ്റ് പരിശോധിക്കുകയും ചികിത്സിക്കുകയും ചെയ്യും. ഓരോ ഘട്ടവും വിശദീകരിക്കും; എപ്പോൾ വേണമെങ്കിലും ചോദിക്കാം, നിർത്താം.', simple: 'സംസാരവും ഭാഷയും പരിശോധിച്ച് തെറാപ്പി നൽകും. എപ്പോൾ വേണമെങ്കിലും നിർത്താം.' },
              records: { label: 'ചികിത്സയ്ക്കായി രേഖകൾ സൂക്ഷിക്കൽ', text: 'സുരക്ഷിതവും തുടർച്ചയുള്ളതുമായ ചികിത്സയ്ക്കായി കുറിപ്പുകളും ലക്ഷ്യങ്ങളും റിപ്പോർട്ടുകളും സൂക്ഷിക്കുന്നു. ചികിത്സിക്കുന്നവർക്കു മാത്രമേ കാണാൻ കഴിയൂ. നിങ്ങളെ റഫർ ചെയ്ത വിദഗ്ധന് ഞങ്ങൾ ഒരു ചെറിയ സംഗ്രഹം അയയ്ക്കും. തെറാപ്പി കഴിഞ്ഞ് {years} വർഷം സൂക്ഷിക്കും.', simple: 'തെറാപ്പിയെക്കുറിച്ച് കുറിപ്പുകൾ എഴുതും. നിങ്ങളുടെ തെറാപ്പിസ്റ്റുകൾ മാത്രം കാണും.' },
              students: { label: 'മേൽനോട്ടത്തിൽ വിദ്യാർത്ഥി തെറാപ്പിസ്റ്റുകൾ', text: 'യോഗ്യതയുള്ള തെറാപ്പിസ്റ്റിന്റെ മേൽനോട്ടത്തിൽ വിദ്യാർത്ഥികൾ പരിശോധനയോ തെറാപ്പിയോ ചെയ്യുകയും ആവശ്യമായ കുറിപ്പുകൾ കാണുകയും ചെയ്യാം.', simple: 'അധ്യാപകൻ നോക്കിനിൽക്കെ ഒരു വിദ്യാർത്ഥി സഹായിച്ചേക്കാം.' },
              reports: { label: 'കുടുംബത്തിന് പുരോഗതി റിപ്പോർട്ടുകൾ', text: 'നിങ്ങൾ തരുന്ന വിലാസത്തിലേക്ക് സുരക്ഷിത ലിങ്ക് വഴി ചെറിയ റിപ്പോർട്ടുകൾ അയച്ചേക്കാം.', simple: 'നിങ്ങൾക്ക് ചെറിയ റിപ്പോർട്ടുകൾ അയച്ചേക്കാം.' },
              reminders: { label: 'അപ്പോയിന്റ്മെന്റ് ഓർമ്മപ്പെടുത്തലുകൾ', text: 'SMS അല്ലെങ്കിൽ WhatsApp Business വഴി ഓർമ്മപ്പെടുത്തൽ അയച്ചേക്കാം. അതിൽ ക്ലിനിക്കിന്റെ പേര്, തീയതി, സമയം, ലിങ്ക് മാത്രം; ആരോഗ്യ വിവരങ്ങൾ ഇല്ല.', simple: 'സമയം ഓർമ്മിപ്പിക്കാൻ സന്ദേശം അയച്ചേക്കാം.' },
              teaching: { label: 'പേര് മറച്ച് പഠനത്തിൽ ഉപയോഗം', text: 'പേരിനു പകരം കേസ് കോഡും ഇനിഷ്യലുകളും ഉപയോഗിച്ച് വിദ്യാർത്ഥികൾ ഈ കേസ് പഠനത്തിൽ ഉപയോഗിച്ചേക്കാം. ചിലപ്പോൾ മറ്റുള്ളവർ തിരിച്ചറിഞ്ഞേക്കാം, അതിനാൽ വേറെ ചോദിക്കുന്നു.', simple: 'വിദ്യാർത്ഥികൾ ഈ കേസിൽ നിന്ന് പഠിച്ചേക്കാം. പേര് മറയ്ക്കും.' }
            },
            rights: 'നിങ്ങളുടെ വിവരങ്ങൾ കാണാനും തിരുത്താൻ ആവശ്യപ്പെടാനും ഏതു സമ്മതവും എപ്പോൾ വേണമെങ്കിലും പിൻവലിക്കാനും കഴിയും. ചോദ്യങ്ങൾക്കും പരാതികൾക്കും {contact} നെ ബന്ധപ്പെടുക. ഇന്ത്യയിലെ ഡാറ്റ പ്രൊട്ടക്ഷൻ ബോർഡിനും പരാതി നൽകാം.',
            signHere: 'ഈ വിവരം ഞാൻ വായിച്ചു അല്ലെങ്കിൽ എനിക്ക് വിശദീകരിച്ചു തന്നു; മുകളിലെ ഉത്തരങ്ങൾ എന്റെ തീരുമാനമാണ്.'
          },
          kn: {
            status: 'draft-translation',
            title: 'ನಿಮ್ಮ ಚಿಕಿತ್ಸೆ ಮತ್ತು ನಿಮ್ಮ ಮಾಹಿತಿಯ ಬಳಕೆ',
            intro: '{clinic} ಮಾತು ಮತ್ತು ಭಾಷೆಯ ಪರೀಕ್ಷೆ ಮತ್ತು ಥೆರಪಿ ನೀಡುತ್ತದೆ. ಪ್ರಾರಂಭಿಸುವ ಮೊದಲು ನೀವು ಯಾವುದಕ್ಕೆ ಒಪ್ಪುತ್ತೀರಿ ಎಂದು ಕೇಳುತ್ತೇವೆ. ಕೆಲವಕ್ಕೆ ಹೌದು, ಕೆಲವಕ್ಕೆ ಇಲ್ಲ ಎನ್ನಬಹುದು. ಐಚ್ಛಿಕ ಬಳಕೆಗಳಿಗೆ ಇಲ್ಲ ಎಂದರೂ ನಿಮ್ಮ ಚಿಕಿತ್ಸೆ ಬದಲಾಗುವುದಿಲ್ಲ.',
            clinicalHead: 'ಪರೀಕ್ಷೆ ಮತ್ತು ಥೆರಪಿಗೆ ಒಪ್ಪಿಗೆ',
            dataHead: 'ನಿಮ್ಮ ಮಾಹಿತಿಯನ್ನು ನಾವು ಹೇಗೆ ಬಳಸುತ್ತೇವೆ',
            purposes: {
              treatment: { label: 'ಪರೀಕ್ಷೆ ಮತ್ತು ಥೆರಪಿ', text: 'ಸ್ಪೀಚ್ ಮತ್ತು ಲ್ಯಾಂಗ್ವೇಜ್ ಥೆರಪಿಸ್ಟ್ ಪರೀಕ್ಷಿಸಿ ಚಿಕಿತ್ಸೆ ನೀಡುತ್ತಾರೆ. ಪ್ರತಿ ಹಂತವನ್ನು ವಿವರಿಸುತ್ತಾರೆ; ಯಾವಾಗ ಬೇಕಾದರೂ ಪ್ರಶ್ನೆ ಕೇಳಬಹುದು ಅಥವಾ ನಿಲ್ಲಿಸಬಹುದು.', simple: 'ಮಾತು ಮತ್ತು ಭಾಷೆಯನ್ನು ಪರೀಕ್ಷಿಸಿ ಥೆರಪಿ ನೀಡುತ್ತೇವೆ. ಯಾವಾಗ ಬೇಕಾದರೂ ನಿಲ್ಲಿಸಬಹುದು.' },
              records: { label: 'ಚಿಕಿತ್ಸೆಗಾಗಿ ದಾಖಲೆಗಳನ್ನು ಇಡುವುದು', text: 'ಸುರಕ್ಷಿತ ಮತ್ತು ನಿರಂತರ ಚಿಕಿತ್ಸೆಗಾಗಿ ಟಿಪ್ಪಣಿಗಳು, ಗುರಿಗಳು, ವರದಿಗಳನ್ನು ಇಡುತ್ತೇವೆ. ಚಿಕಿತ್ಸೆ ನೀಡುವವರು ಮಾತ್ರ ನೋಡಬಹುದು. ನಿಮ್ಮನ್ನು ಕಳುಹಿಸಿದ ತಜ್ಞರಿಗೆ ನಾವು ಸಣ್ಣ ಸಾರಾಂಶವನ್ನು ಕಳುಹಿಸುತ್ತೇವೆ. ಥೆರಪಿ ಮುಗಿದ ನಂತರ {years} ವರ್ಷ ಇಡುತ್ತೇವೆ.', simple: 'ಥೆರಪಿಯ ಬಗ್ಗೆ ಟಿಪ್ಪಣಿ ಬರೆಯುತ್ತೇವೆ. ನಿಮ್ಮ ಥೆರಪಿಸ್ಟ್‌ಗಳು ಮಾತ್ರ ನೋಡುತ್ತಾರೆ.' },

    return btoa(s);
  }
  function unb64(str) { return Uint8Array.from(atob(str), function (c) { return c.charCodeAt(0); }); }

  function cryptoAvailable() { return !!(window.crypto && crypto.subtle && window.isSecureContext !== false); }

  function deriveKey(pass, salt) {
    return crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 310000, hash: 'SHA-256' }, base,
        { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    });
  }

  function writeEncrypted(json) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, cryptoKey, enc.encode(json)).then(function (ct) {
      localStorage.setItem(ENC_KEY, JSON.stringify({ v: 1, salt: b64(cryptoSalt), iv: b64(iv), ct: b64(new Uint8Array(ct)) }));
      localStorage.removeItem(KEY);
    });
  }

  function save() {
    if (locked) return;
    if (REMOTE) { scheduleFlush(); return; }
    const json = JSON.stringify(state);
    if (cryptoKey) {
      // Writes are chained so the newest state always lands last.
      writing = writing.then(function () { return writeEncrypted(json); }).catch(function (e) { console.warn('Could not save', e); });
      return;
    }
    try { localStorage.setItem(KEY, json); }
    catch (e) { console.warn('Could not save to localStorage', e); }
  }

  function readKeyringPlain() {
    try {
      const o = JSON.parse(localStorage.getItem(KEYRING_KEY) || '{}');
      return o.enc ? {} : (o.keys || {});
    } catch (e) { return {}; }
  }

  function persistKeyring() {
    if (REMOTE) {
      // On a clinic server the keys live in their own file on the server, apart from the records. Only supervisors hold them.
      const u = currentUser();
      if (!u || u.role !== 'supervisor') return Promise.resolve();
      const body = { keys: Object.assign({}, keyring) };
      writing = writing.then(function () { return flush(); }).then(function () { return api('PUT', 'api/keys', body); }).catch(function (e) { console.warn('Could not save patient keys', e); });
      return writing;
    }
    const json = JSON.stringify(keyring), key = cryptoKey;
    writing = writing.then(function () {
      if (!key) { localStorage.setItem(KEYRING_KEY, JSON.stringify({ v: 1, keys: JSON.parse(json) })); return; }
      const iv = crypto.getRandomValues(new Uint8Array(12));
      return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, enc.encode(json)).then(function (ct) {
        localStorage.setItem(KEYRING_KEY, JSON.stringify({ v: 1, enc: true, iv: b64(iv), ct: b64(new Uint8Array(ct)) }));
      });
    }).catch(function (e) { console.warn('Could not save patient keys', e); });

  }

  function setPassphrase(pass) {
    cryptoSalt = crypto.getRandomValues(new Uint8Array(16));
    return deriveKey(pass, cryptoSalt).then(function (key) {

      save();
      return persistKeyring();
    });
  }

  function removePassphrase() {
    return writing.then(function () {
      cryptoKey = null; cryptoSalt = null;
      localStorage.removeItem(ENC_KEY);

      return persistKeyring();
    });
  }

  function unlock(pass) {
    const payload = JSON.parse(localStorage.getItem(ENC_KEY));
    const salt = unb64(payload.salt);
    return deriveKey(pass, salt).then(function (key) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(payload.iv) }, key, unb64(payload.ct)).then(function (plain) {
        cryptoKey = key; cryptoSalt = salt;
        state = migrate(Object.assign(blank(), JSON.parse(dec.decode(plain))));
        locked = false;
        const o = JSON.parse(localStorage.getItem(KEYRING_KEY) || '{}');
        if (!o.enc) { keyring = o.keys || {}; return; }
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(o.iv) }, key, unb64(o.ct)).then(function (k) { keyring = JSON.parse(dec.decode(k)); });
      }, function () { throw new Error('That passphrase is not correct.'); });
    });
  }

  function lock() {
    return writing.then(function () {
      if (!cryptoKey) return;
      cryptoKey = null;
      state = blank();
      keyring = {};
      locked = true;
    });
  }

  /* ---------- sign-in ---------- */

  function hashPassword(pass, saltB64) {
    const salt = saltB64 ? unb64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
    return crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits']).then(function (k) {
      return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: salt, iterations: PW_ITERATIONS, hash: 'SHA-256' }, k, 256);
    }).then(function (bits) { return { pwSalt: b64(salt), pwHash: b64(new Uint8Array(bits)) }; });
  }

  function findUser(login) {
    const q = (login || '').trim().toLowerCase();
    return state.users.find(function (u) { return (u.email || '').toLowerCase() === q || u.name.toLowerCase() === q; });
  }

  function setSession(id) {
    state.settings.currentUserId = id;
    try { if (id) sessionStorage.setItem(SESSION_KEY, id); else sessionStorage.removeItem(SESSION_KEY); } catch (e) { /* storage blocked */ }
  }

  function signIn(login, pass) {
    if (REMOTE) {
      return api('POST', 'api/login', { login: login, password: pass }).then(function () { return connect(); }).then(function () { return currentUser(); });
    }
    const u = findUser(login);
    const fail = function () { audit('Failed sign-in', null, login); throw new Error('Email or password not recognised.'); };
    if (!u) return Promise.resolve().then(fail);
    // Every account needs a password: a supervisor sets a temporary one, and the person chooses their own at first sign-in.
    if (!u.pwHash) { audit('Refused sign-in: no password set', null, u.name); return Promise.reject(new Error('This account has no password yet. Ask a supervisor to set a temporary one.')); }
    return hashPassword(pass, u.pwSalt).then(function (h) {
      if (h.pwHash !== u.pwHash) fail();
      setSession(u.id);
      audit('Signed in');
      return u;
    });
  }

  /* Clinic workspace, first run or after a clean start: the first supervisor chooses their own password. */
  function createFirstSupervisor(name, email, pass, clinicName) {
    if (state.users.length) return Promise.reject(new Error('This clinic already has accounts.'));
    return hashPassword(pass).then(function (h) {
      const u = Object.assign({ id: L.uid('use'), name: name, email: email, role: 'supervisor', mustChange: false }, h);
      state.users.push(u);
      if (clinicName) state.settings.messaging.clinicName = clinicName;
      setSession(u.id);
      audit('Created the clinic\u2019s first supervisor account', null, name);
      return u;
    });
  }

  /*
   * Clean start (clinic workspace): everything goes, including every account. Deletion receipts are kept as proof.
   * The next screen asks for a new first supervisor.
   */
  function cleanStart() {
    const receipts = state.deletionReceipts, n = state.patients.length, by = (currentUser() || {}).name || 'System';
    const p = cryptoKey ? removePassphrase() : Promise.resolve();
    return p.then(function () { return blobClear(); }).then(function () {
      state = blank();
      keyring = {};
      state.deletionReceipts = receipts.concat(n ? [{ id: 'DR-' + L.todayISO().replace(/-/g, '') + '-CLEAN', recordId: '*', caseCode: 'All ' + n + ' patients and all accounts',
        erasedAt: new Date().toISOString(), erasedBy: by, reason: 'Clean start', destroyed: ['All patient records', 'All accounts'],
        keyDestroyed: 'All patient keys destroyed on this device. Old backups stay readable to anyone who still has an older key file and the backup password: destroy those too.' }] : []);
      setSession('');
      save();
      return persistKeyring();
    });
  }

  function signOut() {
    if (REMOTE) {
      const done = function () { disconnect(); emit('change'); };
      return flush().then(function () { return api('POST', 'api/logout', {}); }).then(done, done);
    }
    audit('Signed out'); setSession(''); save();
  }

  function setPassword(userId, pass, mustChange) {
    if (REMOTE) {
      // The server hashes it; hashes never reach the browser.
      return flush().then(function () { return api('POST', 'api/password', { userId: userId, password: pass, mustChange: !!mustChange }); }).then(function () {
        [state, shadow].forEach(function (s) { const u = s && s.users.find(function (x) { return x.id === userId; }); if (u) { u.mustChange = userId === state.settings.currentUserId ? false : !!mustChange; u.hasPassword = true; } });
      });
    }
    return hashPassword(pass).then(function (h) {
      const u = state.users.find(function (x) { return x.id === userId; });
      u.pwSalt = h.pwSalt; u.pwHash = h.pwHash; u.mustChange = !!mustChange;
      save();
    });
  }

  /* ---------- clinic server: sync ---------- */

  let shadow = null;          // the state as the server last confirmed it (for working out what changed)
  let version = 0, flushTimer = null, inflight = null, needRefresh = false, events = null, retryTimer = null;
  let status = REMOTE ? 'connecting' : 'local';
  let busyCheck = function () { return false; };
  let serverInfo = {};
  const listeners = [];

  function emit(type, detail) { listeners.forEach(function (fn) { try { fn(type, detail); } catch (e) { console.warn(e); } }); }
  function setStatus(s) { if (s !== status) { status = s; emit('status', s); } }

  function api(method, url, body) {
    return fetch(url, {
      method: method, credentials: 'same-origin', cache: 'no-store',
      headers: body !== undefined ? { 'Content-Type': 'application/json' } : {},
      body: body !== undefined ? JSON.stringify(body) : undefined
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) {
          const e = new Error(data.error || 'The clinic server refused this (' + res.status + ').');
          e.status = res.status;
          if (res.status === 401 && url !== 'api/login' && shadow) { disconnect(); emit('signedout'); }
          throw e;
        }
        return data;
      });
    }, function () {
      const e = new Error('Can’t reach the clinic server.');
      e.status = 0;
      throw e;
    });
  }

  function readPrefs() { try { return JSON.parse(localStorage.getItem(PREFS_KEY) || '{}'); } catch (e) { return {}; } }
  function writePrefs() {
    const o = {};
    Sync.LOCAL_SETTINGS.forEach(function (k) { if (k !== 'currentUserId') o[k] = state.settings[k]; });
    try { localStorage.setItem(PREFS_KEY, JSON.stringify(o)); } catch (e) { /* storage blocked */ }
  }

  /* Take the server's copy. Changes made here that haven't reached the server yet are replayed on top of it. */
  function adopt(data) {
    const pending = shadow ? Sync.diff(shadow, state) : [];
    remoteMe = data.me;
    const fresh = migrate(Object.assign(blank(), data.state));
    Object.assign(fresh.settings, readPrefs(), { currentUserId: data.me });
    shadow = Sync.clone(fresh);
    Sync.apply(fresh, pending);
    state = fresh;
    version = data.version;
    keyring = data.keys || {};
    if (pending.length) scheduleFlush();
  }

  function connect() {
    return api('GET', 'api/state').then(function (data) {
      adopt(data);
      setStatus('synced');
      listen();
    });
  }

  function disconnect() {
    if (events) { events.close(); events = null; }
    clearTimeout(flushTimer); clearTimeout(retryTimer);
    shadow = null; version = 0; keyring = {}; remoteMe = '';
    state = blank();
    setStatus('signedout');
  }

  // The server announces each new version; fetch it unless it is our own change.
  function listen() {
    if (events || typeof EventSource === 'undefined') return;
    events = new EventSource('api/events');
    events.onmessage = function (ev) {
      let v = 0;
      try { v = JSON.parse(ev.data).version; } catch (e) { return; }
      if (status === 'offline') setStatus('synced');
      if (v > version) { needRefresh = true; if (!inflight) refresh(); }
    };
    events.onerror = function () { if (shadow) setStatus('offline'); };
  }

  function refresh() {
    needRefresh = false;
    if (!shadow) return Promise.resolve();
    // Don't swap records under someone's open form; try again shortly.
    if (busyCheck()) { clearTimeout(retryTimer); retryTimer = setTimeout(refresh, 2500); return Promise.resolve(); }
    return api('GET', 'api/state').then(function (data) {
      if (!shadow) return;
      adopt(data);
      setStatus('synced');
      emit('change');
    }, function (e) { if (e.status === 0) setStatus('offline'); });
  }

  function scheduleFlush() {
    writePrefs();
    if (!shadow) return;
    clearTimeout(flushTimer);
    flushTimer = setTimeout(flush, 150);
  }

  /* Send what changed since the server last confirmed. */
  function flush() {
    clearTimeout(flushTimer);
    if (inflight) return inflight.then(flush);
    if (!shadow) return Promise.resolve();
    const snap = Sync.clone(state);
    const ops = Sync.diff(shadow, snap);
    if (!ops.length) return Promise.resolve();
    setStatus('saving');
    inflight = api('POST', 'api/changes', { ops: ops }).then(function (r) {
      if (!shadow) return;
      shadow = snap;

      version = r.version;

      if (e.status === 0) { setStatus('offline'); clearTimeout(retryTimer); retryTimer = setTimeout(flush, 5000); }

    }).then(function () {
      inflight = null;
      if (needRefresh) return refresh();
