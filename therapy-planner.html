<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Therapy Planner</title>
  <meta name="description" content="Speech diagnostics and therapy: referrals, case allotment, student coursework, timetable, SMART goals, materials, session logs and reports.">
  <meta name="referrer" content="no-referrer">
  <style>
/* Layout: fixed left rail (bottom bar on phones) + one working column; the day's schedule is the spine. */
:root {
  --bg: #f4f7f7;
  --surface: #ffffff;
  --text: #182426;
  --muted: #586a6d;
  --border: #dde5e6;
  --primary: #0e6b6b;
  --primary-ink: #ffffff;
  --primary-soft: #e1f0ef;
  --good: #1f7a4d;
  --good-soft: #e2f3e9;
  --bad: #b43b2b;
  --bad-soft: #fbe8e4;
  --info: #5a49b8;
  --info-soft: #ece9fa;
  --overlay: rgba(12, 24, 26, .45);
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16, 40, 42, .06), 0 2px 8px rgba(16, 40, 42, .04);
  --fam-language: #2f5fb3; --fam-language-soft: #e7eefb;
  --fam-speech: #7a4fb5; --fam-speech-soft: #f1eafa;
  --fam-fluency: #a8601a; --fam-fluency-soft: #fcefe0;
  --fam-social: #a63d6c; --fam-social-soft: #fae7ef;
  --fam-swallow: #487a1e; --fam-swallow-soft: #ebf4e0;
  --fam-voice: #86680a; --fam-voice-soft: #f7f0d5;
  --fam-other: #586a6d; --fam-other-soft: #eef2f2;
  --lunch: #fbf5e6; --lunch-ink: #7a5a12; --now: #d2452f;
  --font-display: ui-rounded, "SF Pro Rounded", "Avenir Next", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101718; --surface: #172122; --text: #e4ecec; --muted: #9bb0b2; --border: #283738;
    --primary: #5cc4bf; --primary-ink: #0b1a1a; --primary-soft: #1a3433;
    --good: #5ccf93; --good-soft: #163426; --bad: #f08a78; --bad-soft: #3c1f1a;
    --info: #ab9ff2; --info-soft: #28243f; --overlay: rgba(0, 0, 0, .6); --shadow: none;
    --fam-language: #8fb3f5; --fam-language-soft: #1c2943;
    --fam-speech: #c3a4f2; --fam-speech-soft: #2a2140;
    --fam-fluency: #f0b26c; --fam-fluency-soft: #3a2a17;
    --fam-social: #f099be; --fam-social-soft: #3b1d2b;
    --fam-swallow: #a6d677; --fam-swallow-soft: #213119;
    --fam-voice: #e3c75c; --fam-voice-soft: #352e14;
    --fam-other: #9bb0b2; --fam-other-soft: #212d2e;
    --lunch: #2a2616; --lunch-ink: #e6cf8a; --now: #ff7a63;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101718; --surface: #172122; --text: #e4ecec; --muted: #9bb0b2; --border: #283738;
  --primary: #5cc4bf; --primary-ink: #0b1a1a; --primary-soft: #1a3433;
  --good: #5ccf93; --good-soft: #163426; --bad: #f08a78; --bad-soft: #3c1f1a;
  --info: #ab9ff2; --info-soft: #28243f; --overlay: rgba(0, 0, 0, .6); --shadow: none;
  --fam-language: #8fb3f5; --fam-language-soft: #1c2943;
  --fam-speech: #c3a4f2; --fam-speech-soft: #2a2140;
  --fam-fluency: #f0b26c; --fam-fluency-soft: #3a2a17;
  --fam-social: #f099be; --fam-social-soft: #3b1d2b;
  --fam-swallow: #a6d677; --fam-swallow-soft: #213119;
  --fam-voice: #e3c75c; --fam-voice-soft: #352e14;
  --fam-other: #9bb0b2; --fam-other-soft: #212d2e;
  --lunch: #2a2616; --lunch-ink: #e6cf8a; --now: #ff7a63;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  font: 15px/1.5 var(--font-body);
  background: var(--bg);
  color: var(--text);
}
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, .brand { font-family: var(--font-display); text-wrap: balance; }
h1 { font-size: 1.7rem; margin: 0; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.12rem; margin: 1.5rem 0 .6rem; font-weight: 600; }
p { margin: .4rem 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.good { color: var(--good); }
.bad { color: var(--bad); }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 8px; top: 8px; z-index: 10; background: var(--surface); padding: 8px; }

/* layout */
.layout { display: flex; min-height: 100vh; }
.sidebar {
  width: 220px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
  padding: 20px 12px; position: sticky; top: 0; height: 100vh;
}
.brand { font-weight: 700; font-size: 1.1rem; padding: 0 10px 18px; display: flex; gap: 8px; align-items: center; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 8px; color: var(--text); }
.nav a:hover { background: var(--bg); text-decoration: none; }
.nav a.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
main { min-width: 0; padding-block: 28px 80px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); max-width: 980px; outline: none; }

@media (max-width: 760px) {
  .layout { flex-direction: column; }
  .sidebar {
    position: fixed; bottom: 0; top: auto; left: 0; right: 0; width: auto; height: auto; z-index: 5;
    border-right: 0; border-top: 1px solid var(--border); padding-block: 4px calc(4px + env(safe-area-inset-bottom, 0px)); padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px));
  }
  .brand { display: none; }
  .nav { flex-direction: row; justify-content: space-around; }
  .nav a { flex-direction: column; gap: 0; font-size: .65rem; padding: 6px 2px; }
  .nav a svg { width: 22px; height: 22px; }
  main { padding-block: 16px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 1.35rem; }
}

/* page header */
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.head-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.back { display: inline-block; margin-bottom: 8px; font-size: .9rem; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: inherit; font-weight: 500; padding: 8px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); color: var(--text); min-height: 38px;
}
.btn:hover { text-decoration: none; border-color: var(--muted); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn-primary:hover { filter: brightness(1.05); border-color: var(--primary); }
.btn-ghost { background: transparent; }
.btn-danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn-sm { padding: 4px 10px; min-height: 30px; font-size: .85rem; }
.link { background: none; border: 0; color: var(--primary); cursor: pointer; font: inherit; padding: 0; }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin: 14px 0; }
.actions.wrap { flex-wrap: wrap; justify-content: flex-start; }

/* badges & chips */
.badge {
  display: inline-block; font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 99px;
  background: var(--bg); color: var(--muted); border: 1px solid var(--border); text-transform: capitalize; vertical-align: middle;
}
.badge-good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.badge-info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.badge-muted { opacity: .7; }
.chip { font-size: .72rem; font-weight: 600; color: var(--primary); background: var(--primary-soft); padding: 2px 8px; border-radius: 6px; }

/* date nav */
.date-nav { display: flex; gap: 6px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.date-input { font: inherit; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); min-height: 38px; width: auto; }

/* summary strip */
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
.summary > * { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; color: var(--text); }
.summary a:hover { border-color: var(--primary); text-decoration: none; }
.stat { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .summary { grid-template-columns: repeat(2, 1fr); } }

/* schedule */
.schedule { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.appt {
  display: flex; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px; color: var(--text); box-shadow: var(--shadow);
}
.appt:hover { border-color: var(--primary); text-decoration: none; }
.appt.cancelled { opacity: .55; }
.appt-time { width: 90px; flex-shrink: 0; display: flex; flex-direction: column; }
.appt-body { flex: 1; min-width: 0; }
.appt-title { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.appt-meta { margin-top: 4px; font-size: .9rem; }
.chev { font-size: 1.6rem; color: var(--muted); }
@media (max-width: 560px) { .appt { flex-direction: column; align-items: stretch; gap: 6px; } .appt-time { width: auto; flex-direction: row; gap: 8px; align-items: baseline; } .chev { display: none; } }

/* cards & lists */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card h2 { margin: 0; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.list { list-style: none; padding: 0; margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.list li + li { border-top: 1px solid var(--border); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text); }
a.row:hover { background: var(--bg); text-decoration: none; }
.right { text-align: right; }
.empty { text-align: center; padding: 40px 16px; background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); color: var(--muted); }

/* SMART grid */
.smart { display: grid; gap: 4px; margin: 10px 0 0; }
.smart > div { display: flex; gap: 10px; align-items: baseline; }
.smart dt { width: 22px; height: 22px; flex-shrink: 0; border-radius: 6px; background: var(--primary-soft); color: var(--primary); font-weight: 700; display: grid; place-items: center; font-size: .8rem; }
.smart dd { margin: 0; }
.smart dd .muted { display: inline-block; min-width: 84px; }

/* checklists */
.checklist { list-style: none; padding: 0; margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.card .checklist { border: 0; background: none; }
.checklist li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 14px; flex-wrap: wrap; }
.checklist li + li { border-top: 1px solid var(--border); }
.checklist label { display: flex; flex-direction: row; gap: 10px; align-items: center; cursor: pointer; margin: 0; font-size: inherit; font-weight: 400; }
.checklist input { width: 18px; height: 18px; accent-color: var(--primary); }
.checklist input:checked + span { text-decoration: line-through; color: var(--muted); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0; }
.stats > div { display: flex; flex-direction: column; }
.stats .stat { font-size: 1.05rem; }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(2, 1fr); } }

/* chart */
.chart { width: 100%; height: auto; display: block; margin-top: 6px; }
.chart .grid { stroke: var(--border); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 11px; }
.chart .line { fill: none; stroke: var(--primary); stroke-width: 2.5; stroke-linejoin: round; }
.chart .dot { fill: var(--surface); stroke: var(--primary); stroke-width: 2; }
.chart .target { stroke: var(--good); stroke-dasharray: 5 4; stroke-width: 1.5; }
.chart .target-label { fill: var(--good); font-size: 11px; font-weight: 600; }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
.tab { padding: 9px 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
.tab:hover { color: var(--text); text-decoration: none; }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }

/* forms */
label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; font-weight: 500; margin-bottom: 10px; }
.label { font-size: .85rem; font-weight: 500; }
input, select, textarea {
  font: inherit; font-size: .95rem; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--text); width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
textarea { resize: vertical; }
.grid-2, .grid-3, .grid-4 { display: grid; gap: 10px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 560px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } .grid-4 { grid-template-columns: 1fr 1fr; } }
fieldset { border: 1px solid var(--border); border-radius: var(--radius); margin: 0 0 12px; }
legend { font-weight: 600; padding: 0 6px; }
.log-entry legend { font-size: .95rem; }
.pick { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.pick legend { font-size: .85rem; }
label.check { flex-direction: row; align-items: center; gap: 6px; font-weight: 400; margin: 0; }
label.check input { width: auto; }
.inline-new { width: 100%; margin-top: 8px; }
.field { margin-bottom: 10px; }
.segmented { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.segmented label { margin: 0; }
.segmented input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.segmented span { display: inline-block; padding: 6px 12px; border: 1px solid var(--border); border-radius: 99px; cursor: pointer; font-weight: 500; }
.segmented input:checked + span { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.segmented input:focus-visible + span { outline: 2px solid var(--primary); outline-offset: 2px; }
.filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.filters select { width: auto; }
#report-text { font-family: inherit; line-height: 1.55; }

/* table */
.tbl { width: 100%; border-collapse: collapse; font-size: .88rem; margin: 6px 0; }
.tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
.tbl th { color: var(--muted); font-weight: 500; }

/* modal */
dialog { border: 0; border-radius: 14px; padding: 0; width: min(640px, calc(100vw - 24px)); max-height: calc(100vh - 40px); background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
dialog::backdrop { background: var(--overlay); }
.modal-form { display: flex; flex-direction: column; max-height: calc(100vh - 40px); }
.modal-form header, .modal-form footer { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--border); }
.modal-form footer { border-bottom: 0; border-top: 1px solid var(--border); }
.modal-form h2 { margin: 0; }
.modal-body { padding: 16px 18px; overflow-y: auto; }

/* toast */
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); max-width: calc(100vw - 32px); transform: translate(-50%, 40px); opacity: 0; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px; transition: .2s; pointer-events: none; z-index: 20; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 760px) { #toast { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); } }

/* print: just the content, e.g. the materials pick list */
@media print {
  .sidebar, .page-head button, .page-head .btn, .tabs, .date-nav, #toast { display: none !important; }
  main { padding: 0; }
  .card, .checklist, .list { box-shadow: none; break-inside: avoid; }
}

/* additions */
.nav svg { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.brand svg { width: 24px; height: 24px; fill: none; stroke: var(--primary); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.meta-label { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 4px; }
.btn:focus-visible, .tab:focus-visible, .nav a:focus-visible, a.appt:focus-visible, a.row:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.btn-danger-solid { background: var(--bad); border-color: var(--bad); color: var(--surface); }
#confirm { width: min(420px, calc(100vw - 32px)); }
.confirm-form { padding: 18px; }
.confirm-form p { margin: 0 0 6px; font-size: 1rem; }
.stat, .appt-time, .tbl td { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }

/* toolbar */
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .date-nav { margin: 0; }
.seg-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg-toggle button { font: inherit; font-weight: 500; border: 0; background: none; color: var(--muted); padding: 7px 14px; cursor: pointer; min-height: 38px; }
.seg-toggle button + button { border-left: 1px solid var(--border); }
.seg-toggle button.on { background: var(--primary-soft); color: var(--primary); }
.seg-toggle button:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.stat-sep { color: var(--muted); font-weight: 400; }
.span-2 { grid-column: span 2; }
@media (max-width: 560px) { .span-2 { grid-column: auto; } }

/* case type tags: colour = condition family */
.case { display: inline-block; font-size: .72rem; font-weight: 700; padding: 1px 8px; border-radius: 6px; white-space: nowrap; vertical-align: middle;
  color: var(--fam-c, var(--fam-other)); background: var(--fam-s, var(--fam-other-soft)); }
.fam-language { --fam-c: var(--fam-language); --fam-s: var(--fam-language-soft); }
.fam-speech { --fam-c: var(--fam-speech); --fam-s: var(--fam-speech-soft); }
.fam-fluency { --fam-c: var(--fam-fluency); --fam-s: var(--fam-fluency-soft); }
.fam-social { --fam-c: var(--fam-social); --fam-s: var(--fam-social-soft); }
.fam-swallow { --fam-c: var(--fam-swallow); --fam-s: var(--fam-swallow-soft); }
.fam-voice { --fam-c: var(--fam-voice); --fam-s: var(--fam-voice-soft); }
.fam-other { --fam-c: var(--fam-other); --fam-s: var(--fam-other-soft); }
.tt-block .case { background: var(--surface); }

/* timetable */
.tt { --tt-gutter: 64px; position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.tt-row { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border); }
.tt-row.hour { border-top-style: solid; }
.tt-row:first-child { border-top: 0; }
.tt-label { position: absolute; left: 0; width: calc(var(--tt-gutter) - 10px); top: 4px; text-align: right; font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tt-slot { position: absolute; left: var(--tt-gutter); right: 0; top: 0; bottom: 0; border: 0; background: none; cursor: pointer; text-align: left; padding: 0 10px; color: var(--primary); font: inherit; font-size: .8rem; }
.tt-slot span { opacity: 0; }
.tt-slot:hover { background: var(--primary-soft); }
.tt-slot:hover span, .tt-slot:focus-visible span { opacity: 1; }
.tt-slot:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.tt-lunch { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, var(--lunch) 0 10px, transparent 10px 20px), var(--lunch);
  border-block: 2px solid var(--lunch-ink); color: var(--lunch-ink); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px;
  pointer-events: none; font-size: .8rem; text-align: center; padding: 0 8px; }
.tt-lunch strong { font-family: var(--font-display); font-size: 1rem; letter-spacing: .02em; }
.tt-half { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; opacity: .85; }
.tt-now { position: absolute; left: calc(var(--tt-gutter) - 6px); right: 0; height: 0; border-top: 2px solid var(--now); z-index: 3; pointer-events: none; }

  <script>
/* Pure helpers with no DOM or storage access, so they can be unit-tested in Node. */
(function (root) {
  'use strict';

  function uid(prefix) {
    return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function toISODate(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function todayISO() { return toISODate(new Date()); }

  function addDays(iso, n) {
    const [y, m, d] = iso.split('-').map(Number);
    return toISODate(new Date(y, m - 1, d + n));
  }

  function formatDate(iso, opts) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, opts || {
      weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
    });
  }

  function formatTime(hhmm) {
    if (!hhmm) return '';
    const [h, m] = hhmm.split(':').map(Number);
    const suffix = h >= 12 ? 'PM' : 'AM';
    return ((h + 11) % 12 + 1) + ':' + pad(m) + ' ' + suffix;
  }

  /* Accuracy as a whole percentage, or null when there were no trials. */
  function accuracy(correct, trials) {
    const t = Number(trials), c = Number(correct);
    if (!t || t <= 0 || isNaN(c)) return null;
    return Math.round(Math.min(Math.max(c, 0), t) / t * 100);
  }

  function age(dobISO, onISO) {
    if (!dobISO) return '';
    const [y, m, d] = dobISO.split('-').map(Number);
    const [ty, tm, td] = (onISO || todayISO()).split('-').map(Number);
    let years = ty - y;
    if (tm < m || (tm === m && td < d)) years--;
    return years;
  }

  /* One-line SMART goal statement assembled from its parts. */
  function smartStatement(goal) {
    const parts = [goal.specific];
    if (goal.measurable) parts.push(goal.measurable);
    if (goal.timeBound) parts.push('by ' + formatDate(goal.timeBound, { month: 'short', day: 'numeric', year: 'numeric' }));
    return parts.filter(Boolean).join(', ') + '.';
  }

  /* Accuracy history for one goal, oldest first: [{date, accuracy, trials, correct, progress}] */
  function goalSeries(goalId, logs) {
    const points = [];
    logs.forEach(function (log) {
      (log.entries || []).forEach(function (e) {
        if (e.goalId !== goalId) return;
        const acc = e.accuracy != null ? e.accuracy : accuracy(e.correct, e.trials);
        if (acc == null) return;
        points.push({ date: log.date, accuracy: acc, trials: e.trials, correct: e.correct, progress: e.progress, note: e.note });
      });
    });
    return points.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }

  /* Summary stats for a goal's series. Trend compares the last 3 sessions with the 3 before. */
  function goalStats(series, target) {
    if (!series.length) return { sessions: 0, latest: null, average: null, trend: 'none', metTarget: false };
    const vals = series.map(function (p) { return p.accuracy; });
    const avg = function (a) { return a.reduce(function (s, v) { return s + v; }, 0) / a.length; };
    const recent = vals.slice(-3), prior = vals.slice(-6, -3);
    let trend = 'steady';
    if (prior.length) {
      const diff = avg(recent) - avg(prior);
      trend = diff >= 5 ? 'up' : diff <= -5 ? 'down' : 'steady';
    } else if (vals.length >= 2) {
      const diff = vals[vals.length - 1] - vals[0];
      trend = diff >= 5 ? 'up' : diff <= -5 ? 'down' : 'steady';
    }
    const latest = vals[vals.length - 1];
    return {
      sessions: vals.length,
      latest: latest,
      average: Math.round(avg(vals)),
      trend: trend,
      metTarget: target != null && target !== '' && latest >= Number(target)
    };
  }

  /*
   * Materials needed across a set of appointments.
   * Returns [{material, sessions:[{appointment, patient}], count}] sorted by count desc then name.
   */
  function materialsForDay(appointments, goalsById, materialsById, patientsById) {
    const map = {};
    appointments.forEach(function (appt) {
      if (appt.status === 'cancelled') return;
      const seen = {};
      (appt.goalIds || []).forEach(function (gid) {
        const goal = goalsById[gid];
        if (!goal) return;
        (goal.materialIds || []).forEach(function (mid) {
          if (seen[mid] || !materialsById[mid]) return;
          seen[mid] = true;
          if (!map[mid]) map[mid] = { material: materialsById[mid], sessions: [] };
          map[mid].sessions.push({ appointment: appt, patient: patientsById[appt.patientId] });
        });
      });
      (appt.extraMaterialIds || []).forEach(function (mid) {
        if (seen[mid] || !materialsById[mid]) return;
        seen[mid] = true;
        if (!map[mid]) map[mid] = { material: materialsById[mid], sessions: [] };
        map[mid].sessions.push({ appointment: appt, patient: patientsById[appt.patientId] });
      });
    });
    return Object.keys(map).map(function (k) {
      map[k].count = map[k].sessions.length;
      return map[k];
    }).sort(function (a, b) {
      return b.count - a.count || a.material.name.localeCompare(b.material.name);
    });
  }

  /* Material ids needed for a single appointment (goal materials + extras, de-duplicated). */
  function appointmentMaterialIds(appt, goalsById) {
    const ids = [];
    (appt.goalIds || []).forEach(function (gid) {
      const g = goalsById[gid];
      (g && g.materialIds || []).forEach(function (mid) { if (ids.indexOf(mid) < 0) ids.push(mid); });
    });
    (appt.extraMaterialIds || []).forEach(function (mid) { if (ids.indexOf(mid) < 0) ids.push(mid); });
    return ids;
  }

  function toMinutes(hhmm) {
    if (!hhmm) return 0;
    const [h, m] = hhmm.split(':').map(Number);
    return h * 60 + (m || 0);
  }

  function fromMinutes(mins) { return pad(Math.floor(mins / 60)) + ':' + pad(mins % 60); }

  /*
   * Timetable layout for one day. Overlapping sessions sit side by side in lanes.
   * Returns { start, end, blocks:[{appt, start, end, lane, lanes}] } with times in minutes since midnight.
   * The visible range is at least dayStart–dayEnd and stretches to whole hours around any session outside it.
   */
  function layoutDay(appointments, dayStart, dayEnd) {
    const items = appointments.map(function (a) {
      const start = toMinutes(a.time);
      return { appt: a, start: start, end: start + (Number(a.duration) || 30), lane: 0, lanes: 1 };
    }).sort(function (a, b) { return a.start - b.start || b.end - a.end; });

    let cluster = [], laneEnds = [], clusterEnd = -1;
    function closeCluster() {
      cluster.forEach(function (it) { it.lanes = laneEnds.length; });
      cluster = []; laneEnds = [];
    }
    items.forEach(function (it) {
      if (it.start >= clusterEnd) closeCluster();
      let lane = laneEnds.findIndex(function (end) { return end <= it.start; });
      if (lane < 0) { lane = laneEnds.length; laneEnds.push(it.end); } else laneEnds[lane] = it.end;
      it.lane = lane;
      cluster.push(it);
      clusterEnd = Math.max(clusterEnd, it.end);
    });
    closeCluster();

    let start = toMinutes(dayStart || '08:00'), end = toMinutes(dayEnd || '17:00');
    items.forEach(function (it) {
      start = Math.min(start, Math.floor(it.start / 60) * 60);
      end = Math.max(end, Math.ceil(it.end / 60) * 60);
    });
    return { start: start, end: end, blocks: items };
  }

  /* Split sessions into before / after lunch by start time. */
  function splitByLunch(appointments, lunchStart) {
    const cut = toMinutes(lunchStart || '12:00');
    return {
      morning: appointments.filter(function (a) { return toMinutes(a.time) < cut; }),
      afternoon: appointments.filter(function (a) { return toMinutes(a.time) >= cut; })
    };
  }

  /* Case types: the condition picks a colour family so a day's mix is visible at a glance. */
  const CONDITIONS = {
    Child: ['DLD', 'Speech sound disorder', 'CLP', 'Childhood apraxia of speech', 'Autism', 'Stammering', 'Hearing loss', 'Feeding', 'Voice', 'Global developmental delay'],
    Adult: ['Stroke – aphasia', 'Stroke – dysarthria', 'Dysphagia', "Parkinson's", 'TBI', 'Head & neck cancer', 'Dementia', 'Voice', 'Stammering', 'MND']
  };
  const FAMILY_RULES = [
    ['swallow', /dysphag|feed|swallow/i],
    ['language', /dld|aphasia|language|dementia|tbi|developmental/i],
    ['speech', /clp|cleft|speech sound|ssd|apraxia|cas|dysarthria|parkinson|mnd|artic|phono|hearing/i],
    ['fluency', /stammer|stutter|fluen/i],
    ['social', /autis|asd|social|pragmat/i],
    ['voice', /voice|head & neck|laryn/i]
  ];
  function conditionFamily(condition) {
    for (let i = 0; i < FAMILY_RULES.length; i++) if (FAMILY_RULES[i][1].test(condition || '')) return FAMILY_RULES[i][0];
    return 'other';
  }
  function ageGroup(patient, onISO) {
    if (patient.ageGroup) return patient.ageGroup;
    if (!patient.dob) return '';
    return age(patient.dob, onISO) >= 18 ? 'Adult' : 'Child';
  }
  function caseLabel(patient) {
    return [ageGroup(patient), patient.condition].filter(Boolean).join(' · ');
  }

  /* ---------- people, privacy and workflow ---------- */

  const ROLES = {
    diagnostician: { label: 'Diagnostician', dept: 'Diagnostics' },
    therapist: { label: 'Speech therapist', dept: 'Therapy' },
    supervisor: { label: 'Clinical supervisor', dept: 'Therapy' },
    student: { label: 'Student clinician', dept: 'Therapy' }
  };

  function initials(name) {
    return (name || '').split(/\s+/).filter(Boolean).map(function (w) { return w[0].toUpperCase() + '.'; }).join('');
  }

  function caseCode(year, n) { return 'SLT-' + String(year).slice(-2) + '-' + String(n).padStart(3, '0'); }

  /* Who may open a patient's record (need-to-know). */
  function canSeePatient(user, p) {
    if (!user || !p) return false;
    switch (user.role) {
      case 'supervisor': return true;
      case 'diagnostician': return p.status === 'waiting' || p.status === 'referred' || p.assessedBy === user.id;
      case 'therapist': return p.assignedTo === user.id || p.status === 'referred';
      case 'student': return p.assignedTo === user.id;
      default: return false;
    }
  }

  /* Can this patient be allotted to this clinician? */
  function canAllot(p, assignee) {
    if (!assignee) return { ok: false, reason: 'Choose who will take the case.' };
    const c = p.consent || {};
    if (!c.therapy) return { ok: false, reason: 'Consent for therapy has not been recorded.' };
    if (assignee.role === 'student' && !c.students) return { ok: false, reason: 'No consent for student clinicians. Allot to a qualified therapist, or record consent first.' };
    return { ok: true };
  }

  function addYears(iso, n) {
    const [y, m, d] = iso.split('-').map(Number);

/* UI: hash router, views and forms. */
(function () {

  /* ---------- helpers ---------- */

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function opt(value, label, selected) {
    return '<option value="' + esc(value) + '"' + (selected ? ' selected' : '') + '>' + esc(label) + '</option>';
  }
  function maps() {
    const st = S.state;
    return { goals: S.byId(st.goals), materials: S.byId(st.materials), patients: S.byId(st.patients) };
  }
  function parseHash() {
    const raw = route.replace(/^#\/?/, '');
    const [path, qs] = raw.split('?');
    const params = {};
    (qs || '').split('&').filter(Boolean).forEach(function (kv) {
      const [k, v] = kv.split('=');
      params[decodeURIComponent(k)] = decodeURIComponent(v || '');
    });
    return { parts: path.split('/').filter(Boolean), params: params };
  }
  let route = location.hash || '#/schedule';
  function go(hash) {
    if (hash === route) return;
    route = hash;
    try { history.replaceState(null, '', hash); } catch (e) { /* sandboxed frame */ }
    render();
    window.scrollTo(0, 0);
  }
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }
  function ask(message, okLabel) {
    const dlg = document.getElementById('confirm');
    dlg.innerHTML = '<form method="dialog" class="confirm-form"><p>' + esc(message) + '</p><div class="actions">' +
      '<button class="btn" value="no">Cancel</button> <button class="btn btn-danger-solid" value="yes">' + esc(okLabel || 'Delete') + '</button></div></form>';
    return new Promise(function (resolve) {
      dlg.addEventListener('close', function done() { dlg.removeEventListener('close', done); resolve(dlg.returnValue === 'yes'); });
      dlg.returnValue = '';
      dlg.showModal();
      dlg.querySelector('[value=no]').focus();
    });
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('Copied to clipboard'); }, fallback);
    } else fallback();
    function fallback() {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('Copied to clipboard'); } catch (e) { toast('Copy failed – select and copy manually'); }
      ta.remove();
    }
  }
  function statusBadge(appt) {
    const log = S.logForAppointment(appt.id);

        (t[0] === current ? ' aria-selected="true"' : '') + '>' + esc(t[1]) + '</a>';
    }).join('') + '</nav>';
  }
  function trendClass(t) { return t === 'up' ? 'good' : t === 'down' ? 'bad' : ''; }

  /* ---------- progress chart (inline SVG) ---------- */

  function chart(series, target) {
    if (!series.length) return '<p class="muted small">No data logged yet.</p>';
    const W = 560, H = 180, pl = 34, pr = 12, pt = 12, pb = 26;
    const iw = W - pl - pr, ih = H - pt - pb;
    const x = function (i) { return pl + (series.length === 1 ? iw / 2 : i * iw / (series.length - 1)); };
    const y = function (v) { return pt + ih - v / 100 * ih; };
    let svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Accuracy over time">';
    [0, 25, 50, 75, 100].forEach(function (v) {
      svg += '<line class="grid" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>' +
        '<text class="axis" x="' + (pl - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
    });
    if (target) {
      svg += '<line class="target" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(target) + '" y2="' + y(target) + '"/>' +
        '<text class="target-label" x="' + (W - pr) + '" y="' + (y(target) - 5) + '" text-anchor="end">Target ' + target + '%</text>';
    }
    const pts = series.map(function (p, i) { return x(i) + ',' + y(p.accuracy); }).join(' ');
    svg += '<polyline class="line" points="' + pts + '"/>';
    const step = Math.ceil(series.length / 8);
    series.forEach(function (p, i) {
      svg += '<circle class="dot" cx="' + x(i) + '" cy="' + y(p.accuracy) + '" r="4"><title>' +
        esc(L.formatDate(p.date, { month: 'short', day: 'numeric' }) + ': ' + p.accuracy + '%') + '</title></circle>';
      if (i % step === 0 || i === series.length - 1) {
        svg += '<text class="axis" x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' +
          esc(L.formatDate(p.date, { month: 'numeric', day: 'numeric' })) + '</text>';
      }
    });
    return svg + '</svg>';
  }

  function goalProgressCard(goal, logs) {

    const active = appts.filter(function (a) { return a.status !== 'cancelled'; });
    const logged = active.filter(function (a) { return S.logForAppointment(a.id); });
    const sent = logged.filter(function (a) { return S.logForAppointment(a.id).reportSent; });
    const common = L.materialsForDay(appts, m.goals, m.materials, m.patients).filter(function (x) { return x.count > 1; });
    const halves = L.splitByLunch(active, st.lunchStart);
    const mode = st.scheduleView || 'timetable';

    let html = '<header class="page-head"><div><h1>Schedule</h1><p class="muted">' + esc(L.formatDate(date)) + '</p></div>' +
      '<button class="btn btn-primary" data-action="new-appt" data-date="' + date + '">+ Add session</button></header>' +
      '<div class="toolbar">' + dateNav('schedule', date) +
      '<div class="seg-toggle" role="group" aria-label="Schedule layout">' +
      '<button class="' + (mode === 'timetable' ? 'on' : '') + '" data-action="sched-view" data-view="timetable" aria-pressed="' + (mode === 'timetable') + '">Timetable</button>' +
      '<button class="' + (mode === 'list' ? 'on' : '') + '" data-action="sched-view" data-view="list" aria-pressed="' + (mode === 'list') + '">List</button></div></div>';

    html += '<div class="summary">' +
      '<div><span class="stat">' + halves.morning.length + ' <span class="stat-sep">/</span> ' + halves.afternoon.length + '</span><span class="muted small">Before / after lunch</span></div>' +
      '<div><span class="stat">' + logged.length + '/' + active.length + '</span><span class="muted small">Logged</span></div>' +
      '<div><span class="stat">' + sent.length + '/' + logged.length + '</span><span class="muted small">Reports sent</span></div>' +
      '<a href="#/materials?date=' + date + '"><span class="stat">' + common.length + '</span><span class="muted small">Shared materials →</span></a>' +
      '</div>';

    html += mode === 'list' ? scheduleList(appts, m, st) : timetable(appts, m, st, date);
    return html;
  }

  function timetable(appts, m, st, date) {
    const lay = L.layoutDay(appts, st.dayStart, st.dayEnd);
    const y = function (mins) { return (mins - lay.start) * PX_PER_MIN; };
    const lunchS = L.toMinutes(st.lunchStart), lunchE = L.toMinutes(st.lunchEnd);
    let html = '<div class="tt" style="height:' + y(lay.end) + 'px">';

    // Half-hour rows double as "add a session here" targets.
    for (let t = lay.start; t < lay.end; t += 30) {
      const hhmm = L.fromMinutes(t);
      const onHour = t % 60 === 0;
      html += '<div class="tt-row' + (onHour ? ' hour' : '') + '" style="top:' + y(t) + 'px;height:' + 30 * PX_PER_MIN + 'px">' +
        (onHour ? '<span class="tt-label">' + esc(L.formatTime(hhmm).replace(':00', '')) + '</span>' : '') +
        '<button class="tt-slot" data-action="new-appt" data-date="' + date + '" data-time="' + hhmm + '" aria-label="Add session at ' + esc(L.formatTime(hhmm)) + '"><span>+ ' + esc(L.formatTime(hhmm)) + '</span></button></div>';
    }
    if (lunchE > lunchS && lunchE > lay.start && lunchS < lay.end) {
      const s0 = Math.max(lunchS, lay.start), e0 = Math.min(lunchE, lay.end);
      const halves = L.splitByLunch(appts.filter(function (a) { return a.status !== 'cancelled'; }), st.lunchStart);
      const n = function (k) { return halves[k].length + ' session' + (halves[k].length === 1 ? '' : 's'); };
      html += '<div class="tt-lunch" style="top:' + y(s0) + 'px;height:' + (e0 - s0) * PX_PER_MIN + 'px">' +
        '<span class="tt-half">▲ Morning · ' + n('morning') + '</span>' +
        '<strong>Lunch ' + esc(L.formatTime(st.lunchStart)) + '–' + esc(L.formatTime(st.lunchEnd)) + '</strong>' +
        '<span class="tt-half">▼ Afternoon · ' + n('afternoon') + '</span></div>';
    }

    if (date === L.todayISO()) {
      const now = new Date(), mins = now.getHours() * 60 + now.getMinutes();
      if (mins >= lay.start && mins <= lay.end) html += '<div class="tt-now" style="top:' + y(mins) + 'px" aria-hidden="true"></div>';
    }

    html += lay.blocks.map(function (b) {
      const a = b.appt;
      const p = m.patients[a.patientId] || { name: 'Unknown patient' };
      const goals = (a.goalIds || []).map(function (id) { return m.goals[id]; }).filter(Boolean);
      const h = (b.end - b.start) * PX_PER_MIN;
      return '<a class="tt-block fam-' + L.conditionFamily(p.condition) + (a.status === 'cancelled' ? ' cancelled' : '') + (h < 60 ? ' compact' : '') + '" href="#/session/' + a.id + '" ' +
        'style="top:' + (y(b.start) + 1) + 'px;height:' + (h - 2) + 'px;left:calc(var(--tt-gutter) + (100% - var(--tt-gutter)) * ' + b.lane + ' / ' + b.lanes + ');width:calc((100% - var(--tt-gutter)) / ' + b.lanes + ' - 4px)">' +
        '<div class="tt-line"><span class="tt-time">' + esc(L.formatTime(a.time)) + '–' + esc(L.formatTime(L.fromMinutes(b.end))) + '</span>' + statusBadge(a) + '</div>' +
        '<div class="tt-line"><strong class="tt-name">' + esc(nm(p)) + '</strong>' + caseTag(p) + '</div>' +
        '<div class="tt-goals">' + (me().role !== 'student' && p.assignedTo ? esc(firstName(p.assignedTo)) + ' · ' : '') + (a.room ? esc(a.room) + ' · ' : '') + goals.map(function (g) { return esc(g.title); }).join(' · ') + '</div>' +
        '</a>';
    }).join('');
    html += '</div>';
    if (!appts.length) html += '<p class="muted small tt-hint">No sessions yet. Tap a time slot to add one.</p>';
    return html;
  }

  function scheduleList(appts, m, st) {
    if (!appts.length) return '<div class="empty"><p>No sessions scheduled for this day.</p></div>';
    const halves = L.splitByLunch(appts, st.lunchStart);
    const item = function (a) {
      const p = m.patients[a.patientId] || { name: 'Unknown patient' };
      const goals = (a.goalIds || []).map(function (id) { return m.goals[id]; }).filter(Boolean);
      const mats = L.appointmentMaterialIds(a, m.goals).map(function (id) { return m.materials[id]; }).filter(Boolean);
      return '<li><a class="appt fam-' + L.conditionFamily(p.condition) + (a.status === 'cancelled' ? ' cancelled' : '') + '" href="#/session/' + a.id + '">' +
        '<div class="appt-time"><strong>' + esc(L.formatTime(a.time)) + '</strong><span class="muted small">' + esc(a.duration || 30) + ' min' + (a.room ? ' · ' + esc(a.room) : '') + '</span></div>' +
        '<div class="appt-body"><div class="appt-title"><strong>' + esc(nm(p)) + '</strong>' + caseTag(p) + statusBadge(a) + '</div>' +
        '<div class="muted small">' + esc([me().role !== 'student' && p.assignedTo ? 'With ' + userName(p.assignedTo) : '', p.diagnosis].filter(Boolean).join(' · ')) + '</div>' +
        '<div class="appt-meta"><span class="meta-label">Goals</span> <span>' + goals.map(function (g) { return esc(g.title); }).join(' · ') + '</span></div>' +
        '<div class="appt-meta muted small"><span class="meta-label">Materials</span> ' + (mats.length ? mats.map(function (x) { return esc(x.name); }).join(', ') : 'No materials listed') + '</div>' +
        '</div><span class="chev" aria-hidden="true">›</span></a></li>';
    };
    let html = '<h2 class="half-head">Morning</h2>' + (halves.morning.length ? '<ol class="schedule">' + halves.morning.map(item).join('') + '</ol>' : '<p class="muted small">No morning sessions.</p>');
    html += '<div class="lunch-divider"><span>Lunch · ' + esc(L.formatTime(st.lunchStart)) + '–' + esc(L.formatTime(st.lunchEnd)) + '</span></div>';
    html += '<h2 class="half-head">Afternoon</h2>' + (halves.afternoon.length ? '<ol class="schedule">' + halves.afternoon.map(item).join('') + '</ol>' : '<p class="muted small">No afternoon sessions.</p>');
    return html;
  }

  function viewSession(apptId, params) {
    const a = S.appointment(apptId);
    if (!a) return '<div class="empty"><p>Session not found.</p><a href="#/schedule">Back to schedule</a></div>';
    const m = maps();
    const p = m.patients[a.patientId] || { name: 'Unknown' };
    if (!canSee(p)) return noAccess();
    const tab = params.tab || 'prep';
    const base = '#/session/' + a.id;
    const log = S.logForAppointment(a.id);

    let html = '<a class="back" href="#/schedule?date=' + a.date + '">‹ Schedule</a>' +
      '<header class="page-head"><div><h1>' + esc(nm(p)) + '</h1><p class="muted">' +
      esc(L.formatDate(a.date, { weekday: 'short', month: 'short', day: 'numeric' })) + ' · ' + esc(L.formatTime(a.time)) +
      ' · ' + esc(a.duration || 30) + ' min' + (a.room ? ' · ' + esc(a.room) : '') + ' ' + statusBadge(a) + '</p>' +
      '<p class="small muted">' + caseTag(p) + ' ' + esc(p.diagnosis || '') + (p.dob ? ' · Age ' + L.age(p.dob) : '') + '</p></div>' +
      '<div class="head-actions"><a class="btn btn-ghost" href="#/patients/' + p.id + '">Patient file</a>' +
      '<button class="btn btn-ghost" data-action="edit-appt" data-id="' + a.id + '">Edit session</button></div></header>' +
      tabs(base, tab, [['prep', 'Goals & materials'], ['log', log ? 'Session log ✓' : 'Log session'], ['progress', 'Progress'], ['report', 'Report']]);

    const goals = (a.goalIds || []).map(function (id) { return m.goals[id]; }).filter(Boolean);

    if (tab === 'prep') {
      const matIds = L.appointmentMaterialIds(a, m.goals);
      const packed = S.state.packed[a.date] || {};
      html += courseworkPanel(a, p);
      html += '<section><h2>Goals for this session</h2>';
      if (!goals.length) html += '<p class="muted">No goals selected. <button class="link" data-action="edit-appt" data-id="' + a.id + '">Choose goals</button></p>';
      html += goals.map(function (g) {
        const st = L.goalStats(L.goalSeries(g.id, S.logsForPatient(p.id)), g.targetAccuracy);
        return '<article class="card goal-card"><div class="card-head"><div><span class="chip">' + esc(g.area) + '</span> <strong>' + esc(g.title) + '</strong></div>' +
          '<span class="small muted">Last: ' + (st.latest != null ? st.latest + '%' : '—') + ' · Target ' + esc(g.targetAccuracy || '—') + '%</span></div>' +
          '<p>' + esc(L.smartStatement(g)) + '</p>' + smartGrid(g) + '</article>';
      }).join('');
      html += '</section><section><h2>Materials to bring</h2>';
      html += matIds.length ? '<ul class="checklist">' + matIds.map(function (id) {
        const mat = m.materials[id];
        return '<li><label><input type="checkbox" data-action="pack" data-date="' + a.date + '" data-id="' + id + '"' + (packed[id] ? ' checked' : '') + '> ' +
          '<span>' + esc(mat.name) + '</span></label><span class="muted small">' + esc(mat.location || '') + '</span></li>';
      }).join('') + '</ul>' : '<p class="muted">No materials linked to these goals.</p>';
      html += '</section><div class="actions"><a class="btn btn-primary" href="' + base + '?tab=log">Start session log →</a></div>';
    }

    if (tab === 'log') html += sessionLogForm(a, goals, log);

    if (tab === 'progress') {
      const logs = S.logsForPatient(p.id);
      html += goals.length ? goals.map(function (g) { return goalProgressCard(g, logs); }).join('') : '<p class="muted">No goals for this session.</p>';
      html += '<p><a href="#/patients/' + p.id + '?tab=progress">See all of this patient\'s goals →</a></p>';
    }

    if (tab === 'report') {
      if (!log) {
        html += '<div class="empty"><p>Log the session first, then the report is generated for you.</p><a class="btn btn-primary" href="' + base + '?tab=log">Log session</a></div>';
      } else {
        html += reportPanel(log, p, m);
      }
    }
    return html;
  }

  function smartGrid(g) {
    const rows = [['S', 'Specific', g.specific], ['M', 'Measurable', g.measurable], ['A', 'Achievable', g.achievable], ['R', 'Relevant', g.relevant],
      ['T', 'Time-bound', g.timeBound ? 'By ' + L.formatDate(g.timeBound, { month: 'short', day: 'numeric', year: 'numeric' }) : '']];
    return '<dl class="smart">' + rows.map(function (r) {
      return '<div><dt title="' + r[1] + '">' + r[0] + '</dt><dd><span class="muted small">' + r[1] + '</span> ' + esc(r[2] || '—') + '</dd></div>';
    }).join('') + '</dl>';
  }

  function sessionLogForm(a, goals, log) {
    const entries = {};
    (log ? log.entries : []).forEach(function (e) { entries[e.goalId] = e; });
    if (!goals.length) return '<p class="muted">Add goals to this session before logging.</p>';
    return '<form id="log-form" data-appt="' + a.id + '">' + goals.map(function (g) {
      const e = entries[g.id] || {};
      return '<fieldset class="card log-entry" data-goal="' + g.id + '"><legend><span class="chip">' + esc(g.area) + '</span> ' + esc(g.title) +
        ' <span class="muted small">target ' + esc(g.targetAccuracy || '—') + '%</span></legend>' +
        '<div class="grid-4">' +
        '<label>Times done (trials)<input type="number" min="0" inputmode="numeric" name="trials" value="' + esc(e.trials || '') + '"></label>' +
        '<label>Correct<input type="number" min="0" inputmode="numeric" name="correct" value="' + esc(e.correct != null ? e.correct : '') + '"></label>' +
        '<label>Accuracy %<input type="number" min="0" max="100" inputmode="numeric" name="accuracy" value="' + esc(e.accuracy != null ? e.accuracy : '') + '"></label>' +
        '<label>Cueing<select name="cueing">' + opt('', '—') + CUEING.map(function (c) { return opt(c, c, e.cueing === c); }).join('') + '</select></label>' +
        '</div>' +
        '<div class="field"><span class="label">Progress</span><div class="segmented">' + PROGRESS.map(function (k) {
          return '<label><input type="radio" name="progress-' + g.id + '" value="' + k + '"' + (e.progress === k ? ' checked' : '') + '><span>' + esc(L.PROGRESS_LABELS[k]) + '</span></label>';
        }).join('') + '</div></div>' +
        '<label>Notes for this goal<textarea name="note" rows="2" placeholder="e.g. Better with visual cue; errors on /sk/ blends">' + esc(e.note || '') + '</textarea></label>' +
        '</fieldset>';
    }).join('') +
      '<div class="card"><label>Session notes (SOAP / journal)<textarea name="notes" rows="4" placeholder="Behaviour, engagement, strategies used, plan for next session">' + esc(log ? log.notes : '') + '</textarea></label>' +
      '<label>Home practice<textarea name="homework" rows="2" placeholder="What the family can practise this week">' + esc(log ? log.homework : '') + '</textarea></label></div>' +
      '<div class="actions"><button type="submit" class="btn btn-primary">Save &amp; create report</button></div></form>';
  }

  function reportPanel(log, p, m) {
    const text = log.reportText || L.clientReport({ patient: p, log: log, goalsById: m.goals, therapist: S.state.settings.therapistName });
    const allowed = p.consent && p.consent.shareReports;
    return '<section class="card"><div class="card-head"><h2>Client report</h2>' +
      (log.reportSent ? '<span class="badge badge-good">Sent</span>' : '<span class="badge">Not sent</span>') + '</div>' +
      (allowed ? '' : '<div class="callout warn"><strong>No permission recorded to send session summaries to this family.</strong><span>Record consent in the patient\'s details before sharing.</span></div>') +
      '<p class="muted small">Edit freely; changes are saved with this session. Send it through your organisation\'s secure email or portal, not personal email or messaging apps.</p>' +
      '<textarea id="report-text" data-log="' + log.id + '" rows="16">' + esc(text) + '</textarea>' +
      '<div class="actions wrap">' +
      '<button class="btn" data-action="copy-report">Copy</button>' +
      '<button class="btn" data-action="regen-report" data-log="' + log.id + '">Regenerate from log</button>' +
      '<button class="btn btn-primary" data-action="toggle-sent" data-log="' + log.id + '">' + (log.reportSent ? 'Mark as not sent' : 'Mark as sent') + '</button>' +
      '</div></section>';
  }

  function viewPatients(params) {
    const st = S.state;
    const fAge = params.age || '', fCond = params.condition || '';
    const mine = visiblePatients();
    const conds = mine.map(function (p) { return p.condition; }).filter(function (c, i, arr) { return c && arr.indexOf(c) === i; }).sort();
    const shown = mine.filter(function (p) { return (!fAge || L.ageGroup(p) === fAge) && (!fCond || p.condition === fCond); });
    let html = '<header class="page-head"><div><h1>Patients</h1><p class="muted">' + mine.length + ' records you can access</p></div>' +
      (me().role !== 'student' ? '<button class="btn btn-primary" data-action="new-patient">' + (me().role === 'therapist' ? '+ Add patient' : '+ Register patient') + '</button>' : '') + '</header>';
    if (!mine.length) return html + '<div class="empty"><p>No patients yet.</p></div>';
    html += '<div class="filters" id="patient-filters">' +
      '<select name="age" aria-label="Adult or child">' + opt('', 'Adults & children') + opt('Child', 'Children', fAge === 'Child') + opt('Adult', 'Adults', fAge === 'Adult') + '</select>' +
      '<select name="condition" aria-label="Case type">' + opt('', 'All case types') + conds.map(function (c) { return opt(c, c, fCond === c); }).join('') + '</select></div>';
    if (!shown.length) return html + '<div class="empty"><p>No patients match.</p></div>';
    html += '<ul class="list">' + shown.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (p) {
      const goals = S.goalsForPatient(p.id).filter(function (g) { return g.status === 'active'; });
      const next = st.appointments.filter(function (a) { return a.patientId === p.id && a.date >= L.todayISO() && a.status !== 'cancelled'; })
        .sort(function (a, b) { return (a.date + a.time).localeCompare(b.date + b.time); })[0];
      return '<li><a class="row" href="#/patients/' + p.id + '"><div><strong>' + esc(nm(p)) + '</strong> ' + caseTag(p) + statusPill(p) +
        '<div class="muted small">' + esc(p.diagnosis || '') + (p.dob ? ' · Age ' + L.age(p.dob) : '') + '</div></div>' +
        '<div class="right small"><div>' + goals.length + ' active goal' + (goals.length === 1 ? '' : 's') + '</div>' +
        '<div class="muted">' + (next ? 'Next: ' + esc(L.formatDate(next.date, { month: 'short', day: 'numeric' })) + ' ' + esc(L.formatTime(next.time)) : 'No upcoming session') + '</div></div></a></li>';
    }).join('') + '</ul>';
    return html;
  }

  function viewPatient(id, params) {
    const p = S.patient(id);
    if (!p) return '<div class="empty"><p>Patient not found.</p><a href="#/patients">Back</a></div>';
    if (!canSee(p)) return noAccess();
    if (lastViewed !== p.id) { lastViewed = p.id; S.audit('Opened patient record', p.id); }
    const tab = params.tab || (p.status === 'active' ? 'goals' : 'record');
    const base = '#/patients/' + p.id;
    const goals = S.goalsForPatient(p.id);
    const logs = S.logsForPatient(p.id);
    const m = maps();

    let html = '<a class="back" href="#/patients">‹ Patients</a>' +
      '<header class="page-head"><div><h1>' + esc(nm(p)) + '</h1>' +
      '<p class="muted">' + esc(p.caseCode) + ' · ' + caseTag(p) + statusPill(p) + ' ' + esc(p.diagnosis || '') + (p.dob ? ' · Age ' + L.age(p.dob) : '') + '</p>' +
      '<p class="small muted">' + esc([p.guardian, p.contact].filter(Boolean).join(' · ')) + '</p></div>' +
      '<div class="head-actions">' + (canManage(p) ? '<button class="btn btn-ghost" data-action="edit-patient" data-id="' + p.id + '">Edit</button>' : '') +
      (p.status === 'active' && me().role !== 'diagnostician' ? '<button class="btn btn-ghost" data-action="new-appt" data-patient="' + p.id + '">+ Session</button>' : '') +
      (isStudentCase(p) ? '<a class="btn btn-ghost" href="#/cases/' + p.id + '">Coursework</a>' : '') + '</div></header>' +
      tabs(base, tab, [['goals', 'SMART goals'], ['progress', 'Progress'], ['history', 'Session journal'], ['record', 'Details & consent']]);
    if (tab === 'record') return html + recordTab(p);

    if (tab === 'goals') {
      html += '<div class="actions"><button class="btn btn-primary" data-action="new-goal" data-patient="' + p.id + '">+ Add SMART goal</button></div>';
      html += goals.length ? goals.map(function (g) { return goalCard(g, m, false); }).join('') : '<p class="muted">No goals yet.</p>';
    }
    if (tab === 'progress') {
      const active = goals.filter(function (g) { return g.status !== 'discontinued'; });
      html += active.length ? active.map(function (g) { return goalProgressCard(g, logs); }).join('') : '<p class="muted">No goals yet.</p>';
    }
    if (tab === 'history') {
      const sorted = logs.slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
      html += sorted.length ? sorted.map(function (log) {
        return '<article class="card"><div class="card-head"><strong>' + esc(L.formatDate(log.date, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })) + '</strong>' +
          (log.appointmentId ? '<a class="small" href="#/session/' + log.appointmentId + '?tab=log">Open</a>' : '') + '</div>' +
          '<table class="tbl"><thead><tr><th>Goal</th><th>Trials</th><th>Acc.</th><th>Cueing</th><th>Progress</th></tr></thead><tbody>' +
          log.entries.map(function (e) {
            const g = m.goals[e.goalId];
            return '<tr><td>' + esc(g ? g.title : '(deleted goal)') + (e.note ? '<div class="muted small">' + esc(e.note) + '</div>' : '') + '</td><td>' + esc(e.trials != null ? e.correct + '/' + e.trials : '') + '</td><td>' +
              esc(e.accuracy != null ? e.accuracy + '%' : '') + '</td><td>' + esc(e.cueing || '') + '</td><td>' + esc(L.PROGRESS_LABELS[e.progress] || '') + '</td></tr>';
          }).join('') + '</tbody></table>' +
          (log.notes ? '<p class="small"><strong>Notes:</strong> ' + esc(log.notes) + '</p>' : '') +
          (log.homework ? '<p class="small"><strong>Home practice:</strong> ' + esc(log.homework) + '</p>' : '') + '</article>';
      }).join('') : '<p class="muted">No sessions logged yet.</p>';
    }
    return html;
  }

  function goalCard(g, m, showPatient) {
    const p = m.patients[g.patientId];
    const mats = (g.materialIds || []).map(function (id) { return m.materials[id]; }).filter(Boolean);
    const statusCls = g.status === 'met' ? 'badge-good' : g.status === 'active' ? 'badge-info' : 'badge-muted';
    return '<article class="card goal-card"><div class="card-head"><div>' +
      (showPatient && p ? '<a class="small" href="#/patients/' + p.id + '">' + esc(nm(p)) + '</a><br>' : '') +
      '<span class="chip">' + esc(g.area) + '</span> <strong>' + esc(g.title) + '</strong></div>' +
      '<div class="head-actions"><span class="badge ' + statusCls + '">' + esc(g.status) + '</span>' +
      '<button class="btn btn-ghost btn-sm" data-action="edit-goal" data-id="' + g.id + '">Edit</button></div></div>' +
      '<p>' + esc(L.smartStatement(g)) + '</p>' + smartGrid(g) +
      '<p class="small"><span class="muted">Materials:</span> ' + (mats.length ? mats.map(function (x) { return esc(x.name); }).join(', ') : '—') + '</p></article>';
  }

  function viewMaterials(params) {
    const tab = params.tab || 'day';
    const date = params.date || L.todayISO();
    const m = maps();
    let html = '<header class="page-head"><div><h1>Materials</h1><p class="muted">' +
      (tab === 'day' ? esc(L.formatDate(date)) : 'Your materials library') + '</p></div>' +
      (tab === 'library' ? '<button class="btn btn-primary" data-action="new-material">+ Add material</button>' : '<button class="btn" data-action="copy-picklist" data-date="' + date + '">Copy pick list</button>') +
      '</header>' +
      '<nav class="tabs"><a class="tab' + (tab === 'day' ? ' active' : '') + '" href="#/materials?tab=day&date=' + date + '">For the day</a>' +
      '<a class="tab' + (tab === 'library' ? ' active' : '') + '" href="#/materials?tab=library">Library</a></nav>';

    if (tab === 'library') {
      const used = {};
      S.state.goals.forEach(function (g) { (g.materialIds || []).forEach(function (id) { (used[id] = used[id] || []).push(g); }); });
      const mats = S.state.materials.slice().sort(function (a, b) { return (a.category || '').localeCompare(b.category || '') || a.name.localeCompare(b.name); });
      if (!mats.length) return html + '<div class="empty"><p>No materials yet.</p></div>';
      return html + '<ul class="list">' + mats.map(function (x) {
        const goals = used[x.id] || [];
        return '<li><div class="row"><div><strong>' + esc(x.name) + '</strong><div class="muted small">' + esc([x.category, x.location].filter(Boolean).join(' · ')) + '</div>' +
          '<div class="small">' + (goals.length ? 'Used for: ' + goals.map(function (g) { return esc(nm(m.patients[g.patientId]) + ' – ' + g.title); }).join('; ') : '<span class="muted">Not linked to any goal</span>') + '</div></div>' +
          '<button class="btn btn-ghost btn-sm" data-action="edit-material" data-id="' + x.id + '">Edit</button></div></li>';
      }).join('') + '</ul>';
    }

    const appts = visibleAppts(S.appointmentsOn(date)).filter(function (a) { return a.status !== 'cancelled'; });
    const all = L.materialsForDay(appts, m.goals, m.materials, m.patients);
    const packed = S.state.packed[date] || {};
    const common = all.filter(function (x) { return x.count > 1; });
    const packedCount = all.filter(function (x) { return packed[x.material.id]; }).length;
    html += dateNav('materials', date);

    if (!appts.length) return html + '<div class="empty"><p>No sessions on this day.</p></div>';

    html += '<p class="muted small">' + packedCount + ' of ' + all.length + ' items ready. Ticks are shared across this day\'s views.</p>';
    const item = function (x, showWho) {
      return '<li><label><input type="checkbox" data-action="pack" data-date="' + date + '" data-id="' + x.material.id + '"' + (packed[x.material.id] ? ' checked' : '') + '> ' +
        '<span>' + esc(x.material.name) + '</span></label>' +
        '<span class="muted small">' + (showWho ? esc(x.sessions.map(function (s) { return nm(s.patient); }).join(', ')) + (x.material.location ? ' · ' : '') : '') + esc(x.material.location || '') + '</span></li>';
    };
    html += '<section><h2>Common materials <span class="muted small">needed in 2+ sessions</span></h2>' +
      (common.length ? '<ul class="checklist">' + common.map(function (x) { return item(x, true); }).join('') + '</ul>' : '<p class="muted">No materials are shared between sessions today.</p>') + '</section>';
    html += '<section><h2>All materials for the day</h2><ul class="checklist">' + all.map(function (x) { return item(x, true); }).join('') + '</ul></section>';
    html += '<section><h2>By session</h2>' + appts.map(function (a) {
      const p = m.patients[a.patientId] || {};
      const ids = L.appointmentMaterialIds(a, m.goals);
      return '<article class="card"><div class="card-head"><strong>' + esc(L.formatTime(a.time)) + ' · ' + esc(nm(p)) + '</strong><a class="small" href="#/session/' + a.id + '">Open</a></div>' +
        (ids.length ? '<ul class="checklist">' + ids.map(function (id) {
          const x = m.materials[id];
          return '<li><label><input type="checkbox" data-action="pack" data-date="' + date + '" data-id="' + id + '"' + (packed[id] ? ' checked' : '') + '> <span>' + esc(x.name) + '</span></label><span class="muted small">' + esc(x.location || '') + '</span></li>';
        }).join('') + '</ul>' : '<p class="muted small">No materials.</p>') + '</article>';
    }).join('') + '</section>';
    return html;
  }

  /* ---------- forms in a modal ---------- */

  function openModal(title, body, onSubmit, onDelete) {
    modal.innerHTML = '<form method="dialog" class="modal-form"><header><h2>' + esc(title) + '</h2>' +
      '<button type="button" class="btn btn-ghost" data-close aria-label="Close">✕</button></header>' +
      '<div class="modal-body">' + body + '</div><footer>' +
      (onDelete ? '<button type="button" class="btn btn-danger" data-delete>Delete</button>' : '<span></span>') +
      '<div><button type="button" class="btn" data-close>Cancel</button> <button type="submit" class="btn btn-primary">Save</button></div></footer></form>';
    const form = modal.querySelector('form');
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      if (!form.reportValidity()) return;
      if (onSubmit(new FormData(form), form) !== false) { modal.close(); render(); }
    });
    modal.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', function () { modal.close(); }); });
    if (onDelete) modal.querySelector('[data-delete]').addEventListener('click', function () {
      ask('Delete this? This cannot be undone.').then(function (ok) { if (ok) { modal.close(); onDelete(); render(); } });
    });
    modal.showModal();
    const first = modal.querySelector('.modal-body input, .modal-body select, .modal-body textarea');
    if (first) first.focus();
    return form;
  }

      [['therapy', 'Assessment and therapy'], ['students', 'Supervised student clinicians may be involved'], ['shareReports', 'Session summaries may be sent to the family'], ['teaching', 'Anonymised use in teaching']].map(function (k) {

        }, fresh ? { caseCode: S.nextCaseCode(), status: u.role === 'therapist' ? 'active' : 'waiting', assignedTo: u.role === 'therapist' ? u.id : '' } : {}));
        if (fresh) {
          S.audit('Registered patient', saved.id);
